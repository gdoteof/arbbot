# Kalshi liquidity-incentive quoting (`arb-trader --lip config/lip.yaml`, rust/bins/arb-trader/src/lip.rs).
#
# Each market rests a `qty` YES bid and YES ask at the best price other makers
# show, holds what fills up to `cap` contracts net, and is quoted only while
# its book (scored by Kalshi's rule, our orders in it) models >= `min_usd_day`.
# The best `max_markets` are quoted at once. `usd_day` is the program's
# period_reward / 10000 over its days, and `until` is its end_date, from
# GET /trade-api/v2/incentive_programs?status=active. Programs are weekly:
# refresh this list when they roll, or quoting stops at `until`.
#
# A market's two orders hold about qty * (1 - spread) of Kalshi cash while
# they rest. Every market holding inventory takes one of the max_markets slots,
# so at most max_markets * cap contracts are ever held. The loss stop pulls
# every quote when inventory marked to mid reaches -loss_stop_usd; it does not
# flatten what is held, and it re-fires if the stop file is removed while P&L
# is still below the stop.
qty: 200
# Inventory, not reward, decides the cap. On the 2026-11-05..11 tape (gas pairs,
# our own orders taken out of the books) the four markets with the most reward
# made $14.80/day at cap 100 against $8.96/day at cap 200: the bigger cap earned
# more reward but held twice the inventory, which sat at the cap and lost more
# than the extra reward.
cap: 100
max_markets: 4
min_usd_day: 3.0
loss_stop_usd: 150
# Every place is a row of Kalshi order history, which the resting-order sweeps
# page through and fail closed past 50,000 rows. The account adds 500-2,000 a
# day without this (2026-11-06..11); 600 keeps the total under ~2,600 a day.
max_places_day: 600
markets:
