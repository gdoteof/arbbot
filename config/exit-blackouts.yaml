# Maker-exit blackouts: from `from` (UTC) on, and before `until` when the row has
# one, no maker exit rests on a relationship whose id contains `family`, and any
# exit already resting there is pulled at the next pass or book event. Hedges
# that are already owed still complete.
#
# Why: a scheduled announcement moves BOTH venues at the same instant. A resting
# exit on the winning side is lifted at its pre-announcement price, and the leg
# left to close is already at 0 or 1, so the loss per contract is up to
# (1 - rest price). Reacting to book events cannot beat that, because there is
# no lead venue to react to. Holding the basket to resolution pays $1 regardless.
#
# Read by arb-trader (`--exit-blackouts`, default this path) every pass. If the
# file is missing there are no blackouts. If the file is DAMAGED, every exit
# everywhere is blacked out until it is fixed. `from` and `until` must be
# exactly YYYY-MM-DDTHH:MM:SSZ, and an `until` that is not after its `from`
# damages the file too.
#
# A row without `until` has no end: after the announcement the market resolves
# and the basket settles, so there is nothing left to exit. Delete the row once
# it has settled. A family decided over several reveals (a weekly chart,
# nominations before a ceremony, a shortlist before nominations, a first round
# before a runoff) takes one row per earlier reveal, each with an `until`
# (exclusive) that reopens the family once the reveal has passed, and an open
# row for the reveal that decides it.
#
# `entries: true` (optional, default false) makes the same window stop ENTRIES
# too: arb-trader re-reads this file every second, pulls every resting entry
# quote on a matching relationship the moment `from` passes, and take-take
# passes those relationships over until `until`. An entry resting across the
# announcement is the same pick-off as a resting exit, with the hedge already at
# 0 or 1. A DAMAGED file stops every entry as well as every exit. Hedges and
# sell-backs that are owed keep running. A row without `until` belongs only on
# an announcement that resolves the market; on a row like brazil-pres-26 (first
# round, not resolution) it would stop entries until the row is deleted.

- family: tsla-q3-deliv
  from: 2026-10-01T04:00:00Z   # 2026-10-01 00:00 ET
  why: Tesla Q3 deliveries report, expected 2026-10-02 ~09:00 ET


