[package]
name = "arb-venue"
version = "0.1.0"
edition = "2021"

# Venue-adapter layer: signing + request-shaping + response-parsing parity with
# the Python gateways. NO network transport in this crate (no reqwest/hyper) —
# real executors land later behind the arb-trader dry-run seam (docs/migration-plan.md).

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rsa = "0.9"                       # pure-Rust RSA-PSS (no openssl) — Kalshi signer
ed25519-dalek = "2"              # PM-US signer
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }  # OsRng for salted PSS signing
# blocking reqwest: the first venue-write is a one-shot tool, so VenueGateway stays sync
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[dev-dependencies]
hex = "0.4"
