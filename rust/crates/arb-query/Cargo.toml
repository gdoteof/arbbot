[package]
name = "arb-query"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Parquet WITHOUT arrow: default-features off drops the whole arrow stack and
# every codec but the one our files actually use. Measured 2026-07-27: 76
# transitive crates, one native (zstd-sys), 9.7s cold build. Enabling `arrow`
# would multiply that for capability this crate does not need.
parquet = { version = "56", default-features = false, features = ["zstd"] }
