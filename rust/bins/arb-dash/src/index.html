/* --------------------------------------------------------------------------
   ROUND TRIPS — the closes, with what they ended up making.

   A separate table from Trades because a round trip is a different object: it
   spans TWO ledger records, and its rate is earned over the time between them
   rather than to a resolution date it never reached. The Trades table's `APR`
   column is an APR-to-hold on capital still committed and stays blank here.
   -------------------------------------------------------------------------- */
function roundTrips(d){
  const trips = (d.rows||[]).filter(r => r.entry_ts);
  const recent = trips.slice(0,8);
  const rows = recent.map(r => {
    const when = (ts) => esc(new Date((ts||0)*1000).toISOString().slice(0,16).replace('T',' '));
    /* MODELLED at either end is modelled overall. A round trip's P&L is only as
       settled as both of its legs, and the entry's fees are inside its basis. */
    const estimateMark = ' <span class="sub" title="Includes estimated fees; not fully venue-confirmed">~</span>';
    const feeMark = r.fees_settled ? '' : estimateMark;
    const entryMark = r.entry_fees_settled ? '' : estimateMark;
    const netMark = r.round_trip_fees_settled ? '' : estimateMark;
    const derived = r.net_source === 'derived:exit_vs_entry'
      ? ' <span class="badge warn" title="the ledger recorded no realized_pnl_usd for this close &mdash; priced from its own exit fills against the entry basis, with venue-reported fees where available, otherwise estimated">derived</span>'
      : '';
    return `<tr>
      <td>${when(r.entry_ts)}<div class="sub">exit ${when(r.ts)}</div></td>
      <td>${esc(r.relationship_id)}</td>
      <td>${esc(r.strategy)}${derived}</td>
      <td class="num">${Number(r.qty).toLocaleString()}</td>
      <td class="num">${usd(r.entry_cost_usd)}${entryMark}</td>
      <td class="num">${usd(r.exit_proceeds_usd, 'this close did not record a whole, readable flatten of both legs &mdash; see the net column')}</td>
      <td class="num warn">$${money(r.fees_usd||0)}${feeMark}</td>
      <td class="num ${usdSign(r.net_usd)}">${usd(r.net_usd, r.unpriced_reason)}${r.net_usd == null ? '' : netMark}</td>
      <td class="num">${held(r.held_days)}</td>
      <td class="num ${usdSign(r.realized_apr_pct)}">${pctf(r.realized_apr_pct)}${r.realized_apr_pct == null ? '' : netMark}</td>
    </tr>`;
  }).join('');
  const t = d.totals || {};
  return $(`<section>
    <h2>Recent round trips &middot; ${trips.length} total</h2>
    <div class="scroll"><table>
      <thead><tr><th>entered / exited (UTC)</th><th>relationship</th><th>strategy</th>
        <th class="num">qty</th><th class="num">entry cost</th><th class="num">proceeds</th>
        <th class="num">exit fees</th><th class="num">net</th><th class="num">held</th>
        <th class="num">realized APR</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="10">no position has been closed against a known entry yet</td></tr>'}</tbody>
    </table></div>
    <details class="audit-note" style="margin-top:10px"><summary>How round-trip pricing and APR work</summary><div class="sub">
      A row appears here only when the ledger still holds the <b>entry</b> the
      exit retired &mdash; matched on the <code>closes_ts</code> the exit names.
      <b>entry cost</b> is that entry's all-in basis (its own fees inside),
      pro-rated to the contracts this exit actually closed, so a partial unwind
      is charged its share and no more. <b>net</b> is the ledger's own
      <code>realized_pnl_usd</code> where the record carries one, and otherwise
      proceeds minus that basis minus the exit's fees &mdash; flagged
      <b class="warn">derived</b>.
      <br><br><b>realized APR annualizes a holding period that is often hours</b>,
      so read it against the <b>held</b> column beside it: a 2c gain turned in
      nine minutes is a real four-figure rate and not a repeatable one. Nothing
      is capped, because a cap is a number nobody can audit. What IS refused is a
      period too short to be one &mdash; a close booked less than a minute after
      its entry keeps its P&amp;L and shows no rate, because four probe pairs on
      disk are a <em>millisecond</em> apart and one of those annualizes to
      &minus;10,646,155%/yr. The book-level rate in the panel above excludes
      those from both sides of its ratio and is weighted by dollar-years, so
      neither a fast winner nor a fast loser can set it.
      ${t.realized_derived_trades ? `<br><br><b class="warn">${t.realized_derived_trades}</b> of these
        are <b>derived</b>: the engine writes <code>fees_pending</code> and does not read fill
        reports, so it books no <code>realized_pnl_usd</code>. Both leg prices are the venues'
        own fills (the crossed leg booked its IOC's <em>limit</em> until 2026-08-26, PR #101);
        PM-US fees are modelled at the category default until settled.` : ''}
      ${d.swapped_legs ? `<br><br><b class="bad">▲ ${d.swapped_legs} close(s) below show <code>unknown</code>
        rather than a net.</b> Their two leg prices were written to the WRONG VENUES by the
        <code>rest-pmus</code> exit writer before it was fixed on 2026-08-25 (PR #97), and unlike
        the ten the appended migration repaired, <b>no <code>correction</code> record has reached
        these</b>. Transposing the two prices moves their P&amp;L by
        <code>2 &times; (pm &minus; kalshi) &times; qty</code>, enough to flip most of them between
        profit and loss, so they are left unpriced rather than shown wrong. Append their
        corrections and they price themselves with no code change.` : ''}
    </div></details>
  </section>`);
}

function tradeRows(d){
  const ui = S.trades;
  const all = d.rows || [];
  const strategies = [...new Set(all.map(r=>r.strategy).filter(Boolean))].sort();
  const category = r => r.status === 'open' ? 'open'
    : r.status === 'closed' ? 'retired' : 'realized';
  const counts = {all:all.length,open:0,realized:0,retired:0,review:0};
  all.forEach(r => { counts[category(r)]++; if(r.net_usd==null && r.status!=='closed') counts.review++; });
  const needle = ui.query.trim().toLowerCase();
  let filtered = all.filter(r => {
    if(ui.status === 'review' && !(r.net_usd==null && r.status!=='closed')) return false;
    if(ui.status !== 'all' && ui.status !== 'review' && category(r) !== ui.status) return false;
    if(ui.strategy !== 'all' && r.strategy !== ui.strategy) return false;
    if(!needle) return true;
    const hay = [r.relationship_id,r.strategy,r.source,r.status,
      ...(r.legs||[]).flatMap(l=>[l.venue,l.market_id,l.side,l.role])].join(' ').toLowerCase();
    return hay.includes(needle);
  });
  const sortVal = (r, key) => key==='time' ? Number(r.ts||0)
    : key==='net' ? Number(r.net_usd ?? -Infinity)
    : key==='qty' ? Number(r.qty||0)
    : Number((r.status==='open' ? r.apr_pct : r.realized_apr_pct) ?? -Infinity);
  const [sortKey, sortDir] = ui.sort.split(':');
  filtered = filtered.slice().sort((a,b) => (sortVal(a,sortKey)-sortVal(b,sortKey))*(sortDir==='asc'?1:-1));
  const pages = Math.max(1,Math.ceil(filtered.length/ui.pageSize));
  const page = Math.min(ui.page,pages);
  const start = (page-1)*ui.pageSize;
  const visible = filtered.slice(start,start+ui.pageSize);
  const rows = visible.map(r=>{
    const cat = category(r);
    const legs = (r.legs||[]).map(l =>
      `<span class="leg-pill ${l.venue}">${esc(l.venue==='polymarket_us'?'PM-US':l.venue)} ${esc(l.side)} ${Number(l.qty)} @ ${Number(l.price).toFixed(3)}</span>`).join('');
    const est = r.resolves_estimated ? ' <span class="sub">est</span>' : '';
    const feeMark = r.fees_settled ? '' : ' <span title="modelled, not settled">~</span>';
    /* NAKED is not a decoration: it is the difference between a hedged basket
       whose profit is arithmetic and a directional bet whose outcome nobody
       knows. `closed` means a later unwind record already retired this line —
       the ledger is append-only and never rewrites the original's status. */
    const naked = (r.status==='open' && r.hedged===false)
      ? ' <span class="badge bad" title="single leg or same-side legs — not hedged">NAKED</span>' : '';
    const qtyNote = (Number(r.qty_booked) !== Number(r.qty))
      ? `<div class="sub">of ${Number(r.qty_booked).toLocaleString()} booked</div>` : '';
    const capital = cat==='realized' ? r.entry_cost_usd
      : cat==='retired' ? r.cost_booked_usd : r.cost_usd;
    const value = cat==='realized' ? r.exit_proceeds_usd : r.payoff_usd;
    const rate = cat==='realized' ? r.realized_apr_pct : r.apr_pct;
    const valueCell = cat==='retired' ? '&mdash;' : usd(value, r.unpriced_reason);
    const netCell = cat==='retired' ? '&mdash;' : usd(r.net_usd, r.unpriced_reason);
    const rateCell = cat==='retired' ? '&mdash;' : pctf(rate);
    return `<tr data-k="trade-${r.ts}">
      <td><div class="trade-primary" title="${esc(r.relationship_id)}">${esc(r.relationship_id)}</div>
        <div class="trade-when">${esc(new Date((r.ts||0)*1000).toISOString().slice(0,16).replace('T',' '))} UTC</div>
        <div class="trade-legs">${legs}</div></td>
      <td>${esc(r.strategy)}<div class="sub">${esc(r.source)}</div></td>
      <td><span class="trade-state ${cat}">${cat}</span>${naked}${r.net_source==='derived:exit_vs_entry'?'<div class="sub warn">derived net</div>':''}</td>
      <td class="num"><b>${Number(r.qty).toLocaleString()}</b>${qtyNote}</td>
      <td class="num trade-money">${usd(capital, r.unpriced_reason)}<span class="sub">${cat==='realized'?'entry basis':'all-in cost'}</span></td>
      <td class="num trade-money">${valueCell}<span class="sub">${cat==='realized'?'exit proceeds':cat==='retired'?'moved to exit row':'payoff at resolve'}</span></td>
      <td class="num trade-money ${usdSign(r.net_usd)}">${netCell}<span class="sub warn">${usd(r.fees_usd||0)} fees${feeMark}</span></td>
      <td>${esc(r.resolves_by||'—')}${est}${cat==='realized'?`<div class="sub">held ${held(r.held_days)}</div>`:''}</td>
      <td class="num ${usdSign(rate)}">${rateCell}<div class="sub">${cat==='open'?'to hold':cat==='realized'?'realized':''}</div></td>
    </tr>`;
  }).join('');
  const tabs = [['all','All'],['open','Open'],['realized','Realized'],['retired','Retired'],['review','Needs review']]
    .map(([k,label])=>`<button class="trade-tab ${ui.status===k?'on':''}" data-trade-status="${k}" aria-pressed="${ui.status===k}">${label} <span class="num">${counts[k]}</span></button>`).join('');
  const option = (v,label) => `<option value="${v}" ${ui.sort===v?'selected':''}>${label}</option>`;
  const stratOptions = `<option value="all">All strategies</option>` + strategies.map(s=>
    `<option value="${esc(s)}" ${ui.strategy===s?'selected':''}>${esc(s)}</option>`).join('');
  const lo = filtered.length ? start+1 : 0, hi = Math.min(start+ui.pageSize,filtered.length);
  return $(`<section class="wide trade-explorer">
    <div class="trade-explorer-head"><div><h2>Trade ledger</h2><div class="sub">Search and slice every booked record without losing the accounting context.</div></div>
      <div class="trade-count">${lo}&ndash;${hi} of ${filtered.length.toLocaleString()}</div></div>
    <div class="trade-tabs">${tabs}</div>
    <div class="trade-toolbar">
      <input id="trade-search" class="trade-control trade-search" type="search" placeholder="Search relationship, market, venue…" value="${esc(ui.query)}" aria-label="Search trades">
      <select id="trade-strategy" class="trade-control" aria-label="Filter by strategy">${stratOptions}</select>
      <select id="trade-sort" class="trade-control" aria-label="Sort trades">
        ${option('time:desc','Newest first')}${option('time:asc','Oldest first')}${option('net:desc','Net: high to low')}${option('net:asc','Net: low to high')}${option('apr:desc','APR: high to low')}${option('qty:desc','Quantity: high to low')}
      </select>
      <select id="trade-page-size" class="trade-control" aria-label="Rows per page">${[25,50,100].map(n=>`<option value="${n}" ${ui.pageSize===n?'selected':''}>${n} per page</option>`).join('')}</select>
    </div>
    <div class="scroll"><table class="trade-table">
      <thead><tr><th>trade / legs</th><th>strategy</th><th>state</th><th class="num">qty</th>
        <th class="num">capital</th><th class="num">value</th><th class="num">net / fees</th>
        <th>resolution</th><th class="num">rate</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="9" style="padding:28px;text-align:center" class="dim">No trades match these filters.</td></tr>'}</tbody>
    </table></div>
    <div class="trade-pagination"><span class="sub">Showing ${lo}&ndash;${hi} of ${filtered.length.toLocaleString()} matching · ${all.length.toLocaleString()} total</span>
      <div class="trade-page-buttons"><button id="trade-prev" data-page="${Math.max(1,page-1)}" ${page<=1?'disabled':''}>Previous</button><span class="num">Page ${page} / ${pages}</span><button id="trade-next" data-page="${page+1}" ${page>=pages?'disabled':''}>Next</button></div></div>
    <div class="trade-method"><details class="audit-note"><summary>Ledger quality and pricing notes</summary><div class="sub">
      <b>~</b> on a fee means MODELLED, not settled &mdash; the engine books
      <code>fees_pending</code> because it does not read fill reports. Cost is
      all-in where the ledger reported it, and derived ex-fees where it did not.
      APR is blank for closed rows: that capital is no longer committed.
      A cell reading <b class="warn">unknown</b> is a number this tab refuses to
      guess &mdash; hover it for the reason.
      ${d.corrections ? `<br>${d.corrections} correction record(s) folded into their targets (${d.corrections_applied||0} record(s) amended) &mdash; a correction amends, it is not a position. Several corrections on one record coalesce, last wins.` : ''}
      ${d.corrections_unmatched ? `<br><b class="bad">▲ ${d.corrections_unmatched} correction(s) reached no record.</b> Each one is a value the ledger RETRACTED that is still being displayed. Check <code>corrects_ts</code> against the file.` : ''}
      ${d.superseded ? `<br><b class="warn">${d.superseded}</b> record(s) marked <code>superseded</code> by a correction and removed from the book.` : ''}
      ${d.orphan_unwinds ? `<br><b class="warn">${d.orphan_unwinds}</b> unwind record(s) name no open basket (missing, unknown, or already-closed <code>closes_ts</code>) &mdash; they close nothing, so something is still reported as on.` : ''}
      ${d.unusable_unwinds ? `<br><b class="bad">▲ ${d.unusable_unwinds} basket(s) named by an unwind that recorded no usable qty</b> &mdash; the remainder cannot be established, so they are unpriced rather than reported as fully open.` : ''}
      ${d.unparsed_lines ? `<br><b class="warn">${d.unparsed_lines}</b> unparsed line(s) &mdash; normal mid-append.` : ''}
    </div></details></div>
  </section>`);
}

/* --------------------------------------------------------------------------
   LIVE TAPE

   The one view that does NOT go through refresh()/render(). Everything else
   redraws a whole panel when a file signature changes, which costs seconds and
   can only show what a panel already renders. Watching an engine work needs
   the events themselves, in order, the moment they exist — so this owns a
   dedicated EventSource and appends rows directly.
   -------------------------------------------------------------------------- */
const TAPE = {es:null, paused:false, rows:0, seen:{}, show:{skip:false}};
const TAPE_MAX = 400;   /* DOM stays bounded; a tape is not a database */

function tapeLine(fr){
  const e = fr.ev || {}, k = fr.kind || 'other';
  const t = e.ts ? new Date(e.ts*1000).toISOString().slice(11,23) : '';
  let body;
  if(k === 'skip')       body = (e.skip||[]).join('; ');
  else if(k === 'basket')body = `${e.relationship_id} x${e.qty} ${e.strategy||''}`;
  else if(k === 'hedge') body = `hedge ${e.hedge_needed} x${e.qty} @ ${e.anchor_price}`;
  else if(k === 'cancel')body = `${e.cancel} ${e.side||''} @ ${e.price||''} (${e.order_id||''})`;
  else if(e.place)       body = `${e.place} ${e.side||''} ${e.count||''} @ ${e.price||''}` +
                                (e.replaces?` <span class="sub">replaces ${e.replaces}</span>`:'');
  else                   body = JSON.stringify(e).slice(0,160);
  const cls = k==='skip' ? 'sub' : (k==='basket'||k==='take-take') ? 'ok' : (k==='cancel'?'warn':'');
  return `<tr data-k="${esc(k)}"><td class="sub">${esc(t)}</td>`+
         `<td><span class="badge ${cls}">${esc(k)}</span></td>`+
         `<td class="sub">${esc(fr.src||'')}</td>`+
         `<td class="${cls}">${body}</td></tr>`;
}

function livePanel(){
  return $(`<section class="wide">
    <h2>Live tape</h2>
    <nav style="padding:0;border:0;margin-bottom:8px">
      <a href="#" id="tape-pause">pause</a>
      <a href="#" id="tape-skips">show skips</a>
      <a href="#" id="tape-clear">clear</a>
      <span class="sub" id="tape-stat" style="margin-left:10px"></span>
    </nav>
    <div class="scroll" style="max-height:70vh">
      <table><thead><tr><th style="width:90px">time</th><th style="width:80px">kind</th>
        <th style="width:110px">source</th><th>event</th></tr></thead>
      <tbody id="tape-body"></tbody></table>
    </div>
    <div class="sub" style="margin-top:8px">
      Pushed per line as the armed engine appends. Skips are hidden by default:
      the engine rejects far more
      than it places, and unfiltered they are all you would see. Newest at the
      top, ${TAPE_MAX} rows kept.
    </div>
  </section>`);
}

function tapeConnect(){
  if(TAPE.es) return;
  const es = new EventSource('/api/tape');
  TAPE.es = es;
  es.onmessage = (m) => {
    if(TAPE.paused) return;
    let fr; try{ fr = JSON.parse(m.data); }catch{ return; }
    const body = document.getElementById('tape-body');
    if(!body){ tapeClose(); return; }          /* navigated away */
    TAPE.seen[fr.kind] = (TAPE.seen[fr.kind]||0) + 1;
    if(fr.kind === 'skip' && !TAPE.show.skip) { tapeStat(); return; }
    body.insertAdjacentHTML('afterbegin', tapeLine(fr));
    TAPE.rows++;
    while(TAPE.rows > TAPE_MAX && body.lastElementChild){
      body.removeChild(body.lastElementChild); TAPE.rows--;
    }
    tapeStat();
  };
  es.onerror = () => { const s=document.getElementById('tape-stat');
    if(s) s.textContent = 'reconnecting…'; };
}
function tapeClose(){ if(TAPE.es){ TAPE.es.close(); TAPE.es = null; } }
function tapeStat(){
  const s = document.getElementById('tape-stat');
  if(!s) return;
  const parts = Object.entries(TAPE.seen).map(([k,v])=>`${k} ${v}`).join(' · ');
  s.textContent = (TAPE.paused ? 'PAUSED · ' : '') + parts;
}
function tapeWire(){
  const on = (id, fn) => { const el = document.getElementById(id);
    if(el) el.onclick = (e)=>{ e.preventDefault(); fn(); }; };
  on('tape-pause', ()=>{ TAPE.paused = !TAPE.paused;
    document.getElementById('tape-pause').textContent = TAPE.paused?'resume':'pause';
    tapeStat(); });
  on('tape-skips', ()=>{ TAPE.show.skip = !TAPE.show.skip;
    document.getElementById('tape-skips').textContent =
      TAPE.show.skip?'hide skips':'show skips'; });
  on('tape-clear', ()=>{ const b=document.getElementById('tape-body');
    if(b) b.innerHTML=''; TAPE.rows=0; TAPE.seen={}; tapeStat(); });
}

function tradeWire(){
  const update = (fn) => set(st => { fn(st.trades); st.trades.page = 1; });
  document.querySelectorAll('[data-trade-status]').forEach(el => {
    el.onclick = () => update(ui => { ui.status = el.dataset.tradeStatus; });
  });
  const search = document.getElementById('trade-search');
  if(search) search.oninput = () => update(ui => { ui.query = search.value; });
  const strategy = document.getElementById('trade-strategy');
  if(strategy) strategy.onchange = () => update(ui => { ui.strategy = strategy.value; });
  const sort = document.getElementById('trade-sort');
  if(sort) sort.onchange = () => update(ui => { ui.sort = sort.value; });
  const size = document.getElementById('trade-page-size');
  if(size) size.onchange = () => update(ui => { ui.pageSize = Number(size.value); });
  const prev = document.getElementById('trade-prev');
  if(prev) prev.onclick = () => set(st => { st.trades.page = Number(prev.dataset.page); });
  const next = document.getElementById('trade-next');
  if(next) next.onclick = () => set(st => { st.trades.page = Number(next.dataset.page); });
}

/* --------------------------------------------------------------------------
   RENDER — the only function permitted to touch the document
   -------------------------------------------------------------------------- */
function renderNav(active){
  document.getElementById('nav').innerHTML = VIEWS.map(v =>
    `<a href="${v.path}" class="${v.path===active?'on':''}">${v.label}</a>`).join('');
}

function render(){
  const p = page();
  renderNav(p);

  const el = document.getElementById('link');
  el.className = 'sub ' + S.link.cls;
  el.textContent = S.link.text;
  el.title = S.link.title;

  const frag = document.createDocumentFragment();
  let meta;
  try{
    meta = DRAW[p](frag);
  }catch(e){
    while(frag.firstChild) frag.removeChild(frag.firstChild);
    meta = fail(frag, e.message || String(e));
  }
  document.getElementById('meta').innerHTML = meta;
  apply(document.getElementById('root'), frag);

  if(p === '/trades') tradeWire();

  // The live tape owns a dedicated connection, so it has to be opened and
  // closed as the view comes and goes — leaving it open would keep an SSE
  // connection (and its 150ms file polling) alive on every other page.
  if(p === '/live'){ tapeWire(); tapeConnect(); } else { tapeClose(); }

}

/* --------------------------------------------------------------------------
   ACTIONS — asynchronous, and they write to S, never to the document
   -------------------------------------------------------------------------- */
const fetchOr = (u) => json(u).catch(e => ({error: String(e.message || e)}));

/* Everything this page shows lands in ONE commit, including an open
   drill-down. Refreshing the chart separately made the table and the chart
   change at different moments; refreshing it through a loading state made it
   blank for the length of the request, ~45ms every 3s, which is a flicker you
   can see. What is on screen stays on screen until its replacement is ready. */
async function refresh(){
  const needs = NEEDS[page()]();
  const keys = Object.keys(needs);
  const jobs = keys.map(k => fetchOr(needs[k]));
  const got = await Promise.all(jobs);
  set(st => {
    keys.forEach((k,i) => { st.data[k] = got[i]; });
  });
}

function connect(){
  const es = new EventSource('/api/stream');
  es.onopen = () => set(st => { st.link =
    {cls:'ok', text:'● live', title:'pushed by the server as files change'}; });
  es.onmessage = (ev) => {
    let frame; try{ frame = JSON.parse(ev.data); }catch{ return; }
    const prev = S.stream;
    set(st => {
      st.stream = frame;
      st.link = {cls:'ok', text:'● live ' + new Date().toLocaleTimeString(),
                 title:'time of the last change the server pushed'};
    });
    // The first frame is not news: the initial refresh() already read everything.
    if(!Object.keys(prev).length) return;
    const topic = TOPIC[page()] || 'books';
    if(prev[topic] !== frame[topic]) refresh();   // refresh() carries the open chart
  };
  es.onerror = () => set(st => { st.link =
    {cls:'bad', text:'● reconnecting…', title:'the dashboard cannot reach the server'}; });
}

render();
refresh();
connect();
// Re-evaluate time-based capital freshness even if SSE or a fetch stalls. This
// only redraws the capital view; it does not create a second polling path.
setInterval(() => { if(page()==='/'&&S.data.books) render(); }, 5000);
</script>
