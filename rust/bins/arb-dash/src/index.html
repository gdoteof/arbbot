<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arbbot books</title>
<style>
  :root{
    --bg:#0e1013; --panel:#161a20; --line:#242a33; --ink:#e6e9ef; --dim:#8b94a3;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --ink:#11151a; --dim:#5b6472;
           --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; --accent:#0969da; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:20px 24px 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.04em;text-transform:uppercase}
  .sub{color:var(--dim);font-size:12px}
  main{padding:8px 24px 48px;display:grid;gap:16px;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));max-width:1500px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  section.wide{grid-column:1/-1}
  h2{font-size:11px;margin:0 0 12px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;
     text-transform:uppercase;letter-spacing:.06em;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    border:1px solid currentColor}
  .big{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv b{font-weight:600;font-variant-numeric:tabular-nums}
  .rule{border-top:1px solid var(--line);margin:8px 0}
  .scroll{overflow-x:auto}
  .err{color:var(--bad);padding:12px}
  code{color:var(--accent)}
  a.rel{color:var(--accent);text-decoration:none}
  button{font:inherit;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
  button:disabled{color:var(--dim);border-color:var(--line);cursor:default}
  a.rel:hover{text-decoration:underline}
  nav{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav a{color:var(--dim);text-decoration:none;padding:8px 14px;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent}
  nav a:hover{color:var(--ink)}
  nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>arbbot books</h1>
  <span class="sub" id="meta">loading…</span>
  <span class="sub" id="link" style="margin-left:auto">● connecting…</span>
</header>
<nav id="nav"></nav>
<main id="root"></main>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const money = (s) => {
  const n = Number(s);
  if (!isFinite(n)) return s;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const sign = (s) => Number(s) < 0 ? 'bad' : 'ok';
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function statement(st){
  const net = Number(st.net_vs_capital);
  return $(`<section>
    <h2>Statement of position &middot; cost basis</h2>
    <div class="big ${net<0?'bad':'ok'}">${net<0?'−':'+'}$${money(Math.abs(net))}</div>
    <div class="sub" style="margin-bottom:10px">net versus capital in</div>
    <div class="kv"><span>capital in</span><b>$${money(st.capital_in)}</b></div>
    <div class="kv"><span>cash</span><b>$${money(st.cash)}</b></div>
    <div class="kv"><span>positions at cost</span><b>$${money(st.positions_at_cost)}</b></div>
    <div class="kv"><span>total assets</span><b>$${money(st.total_assets)}</b></div>
    <div class="rule"></div>
    <div class="kv"><span>trading (realized)</span>
      <b class="${sign(st.trading_realized)}">$${money(st.trading_realized)}</b></div>
    <div class="kv"><span>fees</span><b class="bad">−$${money(st.fees)}</b></div>
  </section>`);
}

function integrityPanel(iv){
  const feeds = (iv.live_feeds||[]).map(f=>`<tr>
      <td>${esc(f.stem)}</td>
      <td class="num">${(f.bytes/1e9).toFixed(2)} GB</td>
      <td class="num ${f.stale?'bad':'ok'}">${f.age_seconds}s</td>
    </tr>`).join('');
  const warns = (iv.warnings||[]).map(w=>`<div class="warn">▲ ${esc(w)}</div>`).join('')
    || '<div class="ok">✓ no warnings</div>';
  return $(`<section>
    <h2>Recording integrity &middot; ${esc(iv.today)}</h2>
    <table><thead><tr><th>feed</th><th class="num">today</th><th class="num">age</th></tr></thead>
    <tbody>${feeds}</tbody></table>
    <div class="rule"></div>
    ${warns}
  </section>`);
}

function reconPanel(rs){
  if(!rs || !rs.length) return $(`<section><h2>Reconciliation</h2>
    <div class="dim">no venue balances supplied</div></section>`);
  const rows = rs.map(r=>`<tr>
      <td>${esc(r.account)}</td>
      <td class="num">$${money(r.books)}</td>
      <td class="num">$${money(r.venue)}</td>
      <td class="num ${r.exact?'ok':'bad'}">${r.exact?'EXACT':money(r.diff)}</td>
    </tr>`).join('');
  return $(`<section>
    <h2>Reconciliation vs venue truth</h2>
    <table><thead><tr><th>account</th><th class="num">books</th>
      <th class="num">venue</th><th class="num">diff</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </section>`);
}

function positionsPanel(ps){
  const rows = ps.map(p=>`<tr>
      <td>${esc(p.venue)}</td>
      <td>${esc(p.market)}</td>
      <td class="num ${Number(p.qty)<0?'warn':''}">${Number(p.qty).toLocaleString()}</td>
      <td class="num">$${money(p.cost)}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Open positions &middot; ${ps.length}</h2>
    <div class="scroll"><table>
      <thead><tr><th>venue</th><th>market</th><th class="num">qty</th>
        <th class="num">cost basis</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">negative qty = short (the hedge leg).
      Both venues withhold $1.00/contract, already inside the cost basis.</div>
  </section>`);
}

function accountsPanel(as_){
  const rows = as_.map(a=>`<tr>
      <td>${esc(a.account)}</td>
      <td class="num ${sign(a.balance)}">$${money(a.balance)}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Trial balance &middot; all accounts</h2>
    <div class="scroll"><table>
      <thead><tr><th>account</th><th class="num">balance</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>`);
}

function coveragePanel(iv){
  const rows=(iv.coverage||[]).slice().reverse().map(c=>`<tr>
      <td>${esc(c.stem)}</td><td>${esc(c.day)}</td>
      <td class="num">${c.jsonl_bytes==null?'<span class="dim">—</span>':(c.jsonl_bytes/1e9).toFixed(2)+' GB'}</td>
      <td class="num">${c.parquet_bytes==null?'<span class="dim">—</span>':(c.parquet_bytes/1e6).toFixed(0)+' MB'}</td>
      <td class="num ${c.unarchived?'bad':'ok'}">${c.unarchived?'UNARCHIVED':'ok'}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Archive coverage &middot; ${iv.unarchived_days} unarchived day(s),
      ${(iv.unarchived_bytes/1e9).toFixed(1)} GB still raw</h2>
    <div class="scroll"><table>
      <thead><tr><th>stem</th><th>day</th><th class="num">jsonl</th>
        <th class="num">parquet</th><th class="num">state</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">A closed day with raw JSONL and no Parquet
      failed to archive. Today is legitimately raw-only.</div>
  </section>`);
}


/* Hand-rolled inline SVG. A localhost instrument does not justify a charting
   dependency, and the existing Python dash already draws this way. */
function costChart(points, maxAgeS){
  const maxAge = (maxAgeS||300) * 1e9;
  const fresh = p => p.age_a_ns != null && p.age_b_ns != null &&
                     p.age_a_ns <= maxAge && p.age_b_ns <= maxAge;
  const pts = points.filter(p => p.basket_cost != null);
  if(!pts.length) return '<div class="dim" style="padding:24px 0">no overlapping quotes in range</div>';
  const W=1100, H=280, PL=54, PR=14, PT=14, PB=26;
  const xs = pts.map(p=>p.ts_local_ns);
  const ys = pts.map(p=>p.basket_cost);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys, 1.0), y1=Math.max(...ys, 1.0);
  const pad=(y1-y0)*0.08 || 0.02; y0-=pad; y1+=pad;
  const sx = t => PL + (W-PL-PR) * (x1===x0 ? 0.5 : (t-x0)/(x1-x0));
  const sy = v => PT + (H-PT-PB) * (1 - (v-y0)/(y1-y0));
  const line = pts.map((p,i)=>`${i?'L':'M'}${sx(p.ts_local_ns).toFixed(1)},${sy(p.basket_cost).toFixed(1)}`).join('');
  const yOne = sy(1.0);
  // Shade below $1.00 — that band IS the arb, gross of fees.
  // Shade only where BOTH legs were fresh. A forward-filled point is drawn as
  // a line but never as claimed arbitrage.
  const fp = pts.filter(fresh);
  const area = fp.length ? `M${sx(fp[0].ts_local_ns).toFixed(1)},${yOne} ` +
    fp.map(p=>`L${sx(p.ts_local_ns).toFixed(1)},${Math.max(sy(p.basket_cost),0).toFixed(1)}`).join('') +
    ` L${sx(fp[fp.length-1].ts_local_ns).toFixed(1)},${yOne} Z` : '';
  const dots = pts.filter(p=>!fresh(p)).map(p=>
    `<circle cx="${sx(p.ts_local_ns).toFixed(1)}" cy="${sy(p.basket_cost).toFixed(1)}" r="1.6"
       fill="var(--dim)" opacity="0.7"/>`).join('');
  const ticks=[y0,(y0+y1)/2,y1,1.0].map(v=>
    `<line x1="${PL}" x2="${W-PR}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"
       stroke="var(--line)" stroke-dasharray="${Math.abs(v-1)<1e-9?'0':'2,4'}"
       stroke-width="${Math.abs(v-1)<1e-9?1.4:1}"/>
     <text x="6" y="${(sy(v)+4).toFixed(1)}" fill="var(--dim)" font-size="11">$${v.toFixed(3)}</text>`).join('');
  const t0=new Date(x0/1e6).toLocaleString(), t1=new Date(x1/1e6).toLocaleString();
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <clipPath id="below"><rect x="${PL}" y="${yOne}" width="${W-PL-PR}" height="${H}"/></clipPath>
    ${ticks}
    <path d="${area}" fill="var(--ok)" opacity="0.16" clip-path="url(#below)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    ${dots}
    <text x="${PL}" y="${H-6}" fill="var(--dim)" font-size="11">${esc(t0)}</text>
    <text x="${W-PR}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="end">${esc(t1)}</text>
  </svg>`;
}

function pairPanels(d, root){
  const r = d.relationship || {};
  const caveats = (r.caveats||[]).map(c=>`<div class="warn">▲ ${esc(c)}</div>`).join('');
  root.append($(`<section class="wide">
    <h2>${esc(d.relationship.id)}
      &middot; <span class="badge ${d.tradable?'ok':'warn'}">${d.tradable?'TRADABLE':'NOT TRADABLE'}</span></h2>
    <div class="kv"><span>direction</span><b style="font-weight:400">${esc(r.direction||'—')}</b></div>
    <div class="kv"><span>verdict</span><b>${esc(r.verdict||'—')} &middot; vetted by ${esc(r.vetted_by||'—')}</b></div>
    <div class="kv"><span>leg A</span><b>${esc(d.leg_a)} &middot; ${d.samples_a} samples</b></div>
    <div class="kv"><span>leg B</span><b>${esc(d.leg_b)} &middot; ${d.samples_b} samples</b></div>
    <div class="kv"><span>oracle risk / tranche</span><b>${esc(r.oracle_risk||'—')} / ${esc(r.tranche||'—')}</b></div>
    ${caveats}
    <div class="sub" style="margin-top:8px">Only a HUMAN verdict makes a pair tradable;
      agent-vetted pairs are recorded and scanned but the runner refuses to quote them.</div>
  </section>`));

  root.append($(`<section class="wide">
    <h2>Basket cost &middot; ${esc(d.from)} → ${esc(d.to)}
      &middot; <span class="dim">${d.points.length} aligned points</span></h2>
    ${costChart(d.points, d.fresh_max_age_s)}
    <div class="kv"><span>priced points</span><b>${d.priced_points}</b></div>
    <div class="kv"><span>both legs fresh (&le; ${d.fresh_max_age_s}s)</span>
      <b class="${d.fresh_points?'ok':'warn'}">${d.fresh_points}</b></div>
    <div class="kv"><span>fresh &amp; under $1.00</span>
      <b class="${d.fresh_points_under_1?'ok':'dim'}">${d.fresh_points_under_1}</b></div>
    <div class="kv"><span>best fresh basket cost</span>
      <b>${d.best_fresh_cost!=null?'$'+d.best_fresh_cost.toFixed(4):'—'}</b></div>
    <div class="sub" style="margin-top:8px">Cost to open, gross of fees: lift leg A's
      ask and take the opposite side of leg B. Shading marks only points where BOTH
      legs quoted recently — grey dots are forward-filled, where one leg's quote is
      stale and the cost was never simultaneously available. Trust the shaded band,
      not the line.</div>
  </section>`));

  const o = d.opportunity;
  root.append($(`<section class="wide">
    <h2>Opportunity logged by the scanner</h2>
    ${o ? `<div class="kv"><span>observations</span><b>${o.observations.toLocaleString()}</b></div>
      <div class="kv"><span>minutes seen</span><b>${o.minutes_seen.toLocaleString()}</b></div>
      <div class="kv"><span>best edge / contract</span><b class="ok">${o.best_edge_per_contract.toFixed(4)}</b></div>
      <div class="kv"><span>best size</span><b>${Math.round(o.best_size).toLocaleString()}</b></div>`
      : '<div class="dim">the scanner logged no opportunity for this pair in range</div>'}
  </section>`));
}

function pairsPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Pairs</h2><div class="err">${esc(d.error)}</div></section>`);
  const rows=(d.rows||[]).map(r=>`<tr>
      <td><a class="rel" href="/pair/${encodeURIComponent(r.id)}">${esc(r.id)}</a></td>
      <td>${esc(r.verdict||'—')}</td>
      <td>${esc(r.vetted_by||'—')}${r.tradable && !r.human_vetted ? ' <span class="dim">+allowlist</span>' : ''}</td>
      <td class="num ${r.tradable?'ok':'dim'}">${r.tradable?'yes':'no'}</td>
      <td class="dim">${(r.legs||[]).length>2 ? (r.legs.length+' legs') : esc((r.legs||[]).map(l=>l.length>44?l.slice(0,44)+'…':l).join('  |  '))}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Tracked pairs &middot; ${d.count} registered &middot; ${d.tradable} tradable
      <span class="dim">(${d.human_vetted} human-vetted + ${d.allowlisted} allowlisted)</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>relationship</th><th>verdict</th><th>vetted by</th>
        <th class="num">tradable</th><th>legs</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>`);
}


const SCENARIOS = [
  ['take-take',     'take / take'],
  ['make-a-take-b', 'make A / take B'],
  ['take-a-make-b', 'take A / make B'],
];

/* The dashboard's ONLY write. POST so nothing fires it by loading a page;
   the server refuses a second concurrent build and writes atomically. */
function rollupPanel(st, day){
  const running = st.running;
  const l = st.last;
  const summary = l ? (l.ok
    ? `<span class="ok">✓ ${esc(l.day)} &middot; ${l.samples.toLocaleString()} samples from
       ${l.events.toLocaleString()} events in ${l.elapsed_s}s</span>`
    : `<span class="bad">✗ ${esc(l.day)}: ${esc(l.error||'failed')}</span>`)
    : '<span class="dim">no build this session</span>';
  const el = $(`<section class="wide">
    <h2>Top-of-book rollup</h2>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button id="rollup-btn" ${running?'disabled':''}>
        ${running?`building ${esc(running)}…`:`rebuild ${esc(day)}`}</button>
      <span class="sub">${summary}</span>
    </div>
    <div class="sub" style="margin-top:8px">Replays the day's tape through a book
      builder to produce the quote series the pair and current views read.
      Costs ~30s on two cores and under 40 MB of memory; it streams, so it does
      not scale with tape size. Writes are atomic — readers never see a partial
      series.</div>
  </section>`);
  const btn = el.querySelector('#rollup-btn');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'starting…';
    await fetch('/api/rollup?day=' + encodeURIComponent(day), {method:'POST'});
    /* No poll loop: the build's progress arrives on the same stream that
       carries everything else. */
  };
  return el;
}

/* Redraw the rollup panel in place from the pushed status. Called on every
   stream frame, which is cheap and means the button reflects the server
   without anyone asking it. */
function paintRollup(st){
  const host = document.getElementById('rollup-host');
  if(!host) return;
  host.innerHTML=''; host.append(rollupPanel(st, host.dataset.day));
}

/* Human-readable duration. "48054s" is a number; "13h 21m" is a fact. */
function dur(sec){
  if(sec==null||sec<0) return '—';
  const s=Math.round(sec);
  if(s<60) return s+'s';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return r?`${m}m ${r}s`:`${m}m`;
  const h=Math.floor(m/60), rm=m%60;
  if(h<24) return rm?`${h}h ${rm}m`:`${h}h`;
  const d=Math.floor(h/24); return `${d}d ${h%24}h`;
}

const ROUTE_LABEL={'take-take':'take / take','make-a-take-b':'make A → take B',
                   'take-a-make-b':'take A → make B','none':'—'};
const SERIES_KEYS=[['take_take','take/take','var(--accent)'],
                   ['make_a_take_b','make A → take B','var(--ok)'],
                   ['take_a_make_b','take A → make B','var(--warn)']];

/* Multi-series edge-over-time chart. Zero line drawn because the sign is the
   whole question: above it the basket pays, below it we would be buying a loss. */
function edgeChart(series, keys, height){
  const H=height||190, W=1100, PL=58, PR=14, PT=12, PB=24;
  const pts=[];
  keys.forEach(([k],i)=>series.forEach(r=>{ if(r[k]!=null) pts.push([r.ts, r[k], i]); }));
  if(!pts.length) return '<div class="dim" style="padding:16px 0">not enough overlap to price a route yet</div>';
  const x0=Math.min(...pts.map(p=>p[0])), x1=Math.max(...pts.map(p=>p[0]));
  let y0=Math.min(0,...pts.map(p=>p[1])), y1=Math.max(0,...pts.map(p=>p[1]));
  const pad=(y1-y0)*0.1||0.01; y0-=pad; y1+=pad;
  const sx=t=>PL+(W-PL-PR)*(x1===x0?0.5:(t-x0)/(x1-x0));
  const sy=v=>PT+(H-PT-PB)*(1-(v-y0)/(y1-y0));
  const lines=keys.map(([k,,col],i)=>{
    const sub=series.filter(r=>r[k]!=null);
    if(!sub.length) return '';
    const d=sub.map((r,j)=>`${j?'L':'M'}${sx(r.ts).toFixed(1)},${sy(r[k]).toFixed(1)}`).join('');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.95"/>`;
  }).join('');
  const zero=sy(0);
  const tick=v=>`<line x1="${PL}" x2="${W-PR}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"
     stroke="var(--line)" stroke-dasharray="2,4"/><text x="4" y="${(sy(v)+4).toFixed(1)}"
     fill="var(--dim)" font-size="11">${v>0?'+':''}${v.toFixed(3)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${tick(y0+pad)}${tick(y1-pad)}
    <line x1="${PL}" x2="${W-PR}" y1="${zero}" y2="${zero}" stroke="var(--bad)" stroke-width="1.2" opacity="0.8"/>
    <text x="4" y="${(zero+4).toFixed(1)}" fill="var(--bad)" font-size="11">0</text>
    ${lines}
    <text x="${PL}" y="${H-4}" fill="var(--dim)" font-size="11">${new Date(x0*1000).toLocaleTimeString()}</text>
    <text x="${W-PR}" y="${H-4}" fill="var(--dim)" font-size="11" text-anchor="end">${new Date(x1*1000).toLocaleTimeString()}</text>
  </svg>`;
}

function seriesLegend(keys){
  return keys.map(([,l,c])=>`<span style="color:${c}">■</span> <span class="dim">${l}</span>`).join(' &nbsp; ');
}

/* Our posted quote over time, with post-fee edge on its OWN axis — the two
   have different units and ranges, so sharing one axis would flatten both. */
function quoteAndEdgeChart(ev, series){
  const q=ev.filter(e=>e.kind!=='cancel' && e.price);
  if(!q.length) return '<div class="dim">no quote history</div>';
  const W=1100,H=210,PL=58,PR=58,PT=12,PB=24;
  const xs=q.map(p=>p.ts).concat(series.map(r=>r.ts));
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const sx=t=>PL+(W-PL-PR)*(x1===x0?0.5:(t-x0)/(x1-x0));
  let qy0=Math.min(...q.map(p=>+p.price)), qy1=Math.max(...q.map(p=>+p.price));
  const qp=(qy1-qy0)*0.15||0.02; qy0-=qp; qy1+=qp;
  const syq=v=>PT+(H-PT-PB)*(1-(v-qy0)/(qy1-qy0));
  const evals=[]; SERIES_KEYS.forEach(([k])=>series.forEach(r=>{if(r[k]!=null)evals.push(r[k]);}));
  let ey0=evals.length?Math.min(0,...evals):0, ey1=evals.length?Math.max(0,...evals):0.01;
  const ep=(ey1-ey0)*0.15||0.01; ey0-=ep; ey1+=ep;
  const sye=v=>PT+(H-PT-PB)*(1-(v-ey0)/(ey1-ey0));
  const keys=[...new Set(q.map(p=>`${p.venue}|${p.market}|${p.side}`))];
  const cols=['var(--accent)','var(--ok)'];
  const qlines=keys.map((k,i)=>{
    const sub=q.filter(p=>`${p.venue}|${p.market}|${p.side}`===k);
    const d=sub.map((p,j)=>`${j?'L':'M'}${sx(p.ts).toFixed(1)},${syq(+p.price).toFixed(1)}`).join('');
    const dots=sub.map(p=>`<circle cx="${sx(p.ts).toFixed(1)}" cy="${syq(+p.price).toFixed(1)}" r="2" fill="${cols[i%2]}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${cols[i%2]}" stroke-width="1.4"/>${dots}`;
  }).join('');
  const elines=SERIES_KEYS.map(([k,,col])=>{
    const sub=series.filter(r=>r[k]!=null);
    if(!sub.length) return '';
    const d=sub.map((r,j)=>`${j?'L':'M'}${sx(r.ts).toFixed(1)},${sye(r[k]).toFixed(1)}`).join('');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.9"/>`;
  }).join('');
  const legend=keys.map((k,i)=>{const[,m,side]=k.split('|');
    return `<span style="color:${cols[i%2]}">■</span> <span class="dim">${esc(m.slice(0,26))} ${esc(side)}</span>`}).join(' &nbsp; ');
  return `<div class="sub" style="margin-bottom:6px">${legend} &nbsp;|&nbsp; dashed = post-fee edge (right axis): ${seriesLegend(SERIES_KEYS)}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <text x="4" y="${PT+10}" fill="var(--dim)" font-size="11">${qy1.toFixed(2)}</text>
    <text x="4" y="${H-PB}" fill="var(--dim)" font-size="11">${qy0.toFixed(2)}</text>
    <text x="${W-PR+6}" y="${PT+10}" fill="var(--dim)" font-size="11">${ey1>0?'+':''}${ey1.toFixed(3)}</text>
    <text x="${W-PR+6}" y="${H-PB}" fill="var(--dim)" font-size="11">${ey0.toFixed(3)}</text>
    <line x1="${PL}" x2="${W-PR}" y1="${sye(0)}" y2="${sye(0)}" stroke="var(--bad)" stroke-width="1" opacity="0.6"/>
    ${qlines}${elines}
    <text x="${PL}" y="${H-4}" fill="var(--dim)" font-size="11">${new Date(x0*1000).toLocaleTimeString()}</text>
    <text x="${W-PR}" y="${H-4}" fill="var(--dim)" font-size="11" text-anchor="end">${new Date(x1*1000).toLocaleTimeString()}</text>
  </svg>`;
}

/* The open drill-down survives a redraw: a push that arrives while you are
   reading a pair's history must not close it. `scroll` is true only for a
   click, so a background repaint never yanks the page. */
let expandedRel = null;

async function showSeries(rel, host, scroll){
  expandedRel = rel;
  host.innerHTML='<div class="dim">loading…</div>';
  const d=await json('/api/intent-series?rel='+encodeURIComponent(rel));
  if(d.error){ host.innerHTML=`<div class="err">${esc(d.error)}</div>`; return; }
  host.innerHTML=`<h2>${esc(rel)} &middot; ${d.events.length} intents &middot; ${d.edge_series.length} priced points
      &middot; <a href="#" id="series-close" class="rel">close</a></h2>
    ${quoteAndEdgeChart(d.events, d.edge_series)}
    <div class="sub" style="margin-top:6px">Solid = our posted quote (left axis).
      Dashed = post-fee edge per route on its own right axis — different units, so a
      shared axis would flatten both.</div>`;
  host.querySelector('#series-close').onclick = e => {
    e.preventDefault(); expandedRel = null; host.innerHTML='';
  };
  if(scroll) host.scrollIntoView({behavior:'smooth', block:'nearest'});
}

const COLS=[
  ['relationship_id','relationship','The vetted pair. Click the row for its history.','s'],
  ['best_route','route','Best available route now. take/take crosses both books immediately; make→take rests one leg and takes the other the moment it fills.','s'],
  ['our_a','our bid A','Our resting BID on leg A — the price we would buy YES at if hit.','n'],
  ['venue_a','venue A','Leg A book, bid/ask.','x'],
  ['our_b','our ask B','Our resting ASK on leg B — the price we would sell YES at if hit.','n'],
  ['venue_b','venue B','Leg B book, bid/ask.','x'],
  ['gross','gross','Basket cost before fees: entry A + (1 − exit B). Below 1.00 is an arb gross.','n'],
  ['fee_a','fee A','Per-contract fee on leg A at clip 25. Kalshi maker 0.0175 vs taker 0.07, ceiled per ORDER.','n'],
  ['fee_b','fee B','Per-contract fee on leg B. PM-US makers pay nothing.','n'],
  ['edge_f','post-fee edge','$1.00 − total cost, per contract. This is the number that matters.','n'],
  ['rest_spread','rest spread','Spread on the leg we rest on. A wide book means the fill is a coin flip, so the edge is not obtainable.','n'],
  ['reprices','reprices','Times the quote has been moved. High means the quoter is chasing, which is a cost.','n'],
  ['since_change_s','since move','Time since this book last MOVED. Not staleness — the series emits on change, so a quiet market has an old sample and a valid quote.','n'],
];

let iSort={key:'edge_f',dir:-1}, iFilter={route:'', actionable:true, tradable:true};

function intentsPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Engine intents</h2>
    <div class="err">${esc(d.error)}</div>
    <div class="sub" style="margin-top:8px">${esc(d.hint||'')}</div></section>`);
  const n=(v,dp=4)=> v==null||v===''? '<span class="dim">—</span>' : Number(v).toFixed(dp);
  const val=(r,k)=>({
    relationship_id:r.relationship_id, best_route:r.best_route,
    our_a:r.leg_a.our_bid, venue_a:r.leg_a.venue_bid, our_b:r.leg_b.our_ask,
    venue_b:r.leg_b.venue_bid,
    gross:r.priced?+r.priced.gross_cost:null, fee_a:r.priced?+r.priced.fee_a:null,
    fee_b:r.priced?+r.priced.fee_b:null, edge_f:r.edge_f,
    rest_spread:r.rest_spread, reprices:(r.leg_a.reprices??0)+(r.leg_b.reprices??0),
    since_change_s:r.since_change_s,
  })[k];

  let rows=(d.rows||[]).slice();
  if(iFilter.route) rows=rows.filter(r=>r.best_route===iFilter.route);
  if(iFilter.actionable) rows=rows.filter(r=>r.actionable);
  if(iFilter.tradable) rows=rows.filter(r=>r.tradable);
  rows.sort((a,b)=>{
    const x=val(a,iSort.key), y=val(b,iSort.key);
    if(typeof x==='string'||typeof y==='string')
      return String(x??'').localeCompare(String(y??''))*iSort.dir;
    return (((y??-1e9)-(x??-1e9)))*(iSort.dir<0?1:-1);
  });

  const head=COLS.map(([k,l,tip])=>{
    const on=iSort.key===k;
    return `<th class="${['n','x'].includes(COLS.find(c=>c[0]===k)[3])?'num':''} sortable" data-key="${k}" title="${esc(tip)}">
      ${l}${on?(iSort.dir<0?' ▾':' ▴'):''}</th>`;
  }).join('');

  const body=rows.map(r=>{
    const e=r.edge_f, p=r.priced;
    return `<tr class="irow" data-rel="${esc(r.relationship_id)}" style="cursor:pointer">
      <td><span class="rel">${esc(r.relationship_id)}</span>
        ${r.tradable?'':'<span class="dim">(not tradable)</span>'}</td>
      <td class="dim">${esc(ROUTE_LABEL[r.best_route]||r.best_route)}</td>
      <td class="num">${n(r.leg_a.our_bid)}</td>
      <td class="num dim">${n(r.leg_a.venue_bid,2)}/${n(r.leg_a.venue_ask,2)}</td>
      <td class="num">${n(r.leg_b.our_ask)}</td>
      <td class="num dim">${n(r.leg_b.venue_bid,2)}/${n(r.leg_b.venue_ask,2)}</td>
      <td class="num dim">${p?n(p.gross_cost):'—'}</td>
      <td class="num dim">${p?n(p.fee_a):'—'}</td>
      <td class="num dim">${p?n(p.fee_b):'—'}</td>
      <td class="num ${e==null?'dim':(e>0?(r.actionable?'ok':'warn'):'bad')}">
        <b>${e==null?'—':(e>0?'+':'')+e.toFixed(4)}</b></td>
      <td class="num ${r.fillable?'dim':'warn'}">${r.rest_spread==null?'—':r.rest_spread.toFixed(3)}</td>
      <td class="num dim">${(r.leg_a.reprices??0)+(r.leg_b.reprices??0)}</td>
      <td class="num dim">${dur(r.since_change_s)}</td>
    </tr>`;}).join('');

  const rbtn=(k,l)=>`<a href="#" data-route="${k}" class="rf ${iFilter.route===k?'on':''}">${l}</a>`;
  const el=$(`<section class="wide">
    <h2>Engine intents &middot; ${d.resting_orders} resting &middot; ${rows.length}/${d.pairs} shown
      &middot; <span class="${d.actionable?'ok':'warn'}">${d.actionable} actionable</span>
      &middot; <span class="badge ${d.engine_live?'ok':'bad'}">${d.engine_live?'ENGINE LIVE':'NOT RUNNING'}</span>
      <span class="dim">last ${dur(d.last_intent_age_s)} ago &middot; rollup ${d.rollup_current?'current':'stale '+dur(d.rollup_coverage_age_s)} &middot; clip ${d.clip}</span></h2>
    <nav style="padding:0;border:0;margin-bottom:8px">
      ${rbtn('','all routes')}${rbtn('take-take','take / take')}${rbtn('make-a-take-b','make A → take B')}${rbtn('take-a-make-b','take A → make B')}
      <span style="flex:1"></span>
      <a href="#" id="f-act" class="${iFilter.actionable?'on':''}">actionable only</a>
      <a href="#" id="f-trd" class="${iFilter.tradable?'on':''}">tradable only</a>
    </nav>
    <div class="scroll"><table>
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Click a header to sort, a row for its history.
      The stream is MAKER-ONLY — a take-take crossing is an immediate execution, never a
      resting quote — so take/take here is priced off the venue books as the
      cross-now alternative. Resting on BOTH legs is not make/make: it is two entry
      points, whichever side gets hit first.<br>
      <b>Actionable</b> = positive edge, the rested leg's book within ${d.max_rest_spread},
      both books known, and the rollup covering the last ${(d.max_coverage_age_s/60)|0} minutes.</div>
    <div id="series-host" style="margin-top:14px"></div>
  </section>`);

  // Through load(), never straight into reloadIntents: a redraw racing a
  // pushed frame clears and re-appends the same root twice.
  el.querySelectorAll('.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.key;
    iSort = (iSort.key===k) ? {key:k,dir:-iSort.dir} : {key:k,dir:-1};
    load();
  });
  el.querySelectorAll('.rf').forEach(a=>a.onclick=(e)=>{
    e.preventDefault(); iFilter.route=a.dataset.route; load();});
  el.querySelector('#f-act').onclick=e=>{e.preventDefault(); iFilter.actionable=!iFilter.actionable; load();};
  el.querySelector('#f-trd').onclick=e=>{e.preventDefault(); iFilter.tradable=!iFilter.tradable; load();};
  const host=el.querySelector('#series-host');
  el.querySelectorAll('.irow').forEach(tr=>tr.onclick=()=>showSeries(tr.dataset.rel, host, true));
  if(expandedRel) showSeries(expandedRel, host, false);
  return el;
}

function topSeriesPanel(t){
  if(!t.rows||!t.rows.length) return $(`<section class="wide">
    <h2>Top opportunities over time</h2>
    <div class="dim">nothing actionable to chart yet</div></section>`);
  const blocks=t.rows.map(r=>`<div style="margin-bottom:14px">
      <div class="sub"><a class="rel" href="/pair/${encodeURIComponent(r.relationship_id)}">${esc(r.relationship_id)}</a>
        &middot; best ${esc(ROUTE_LABEL[r.best_route]||r.best_route)}
        &middot; now ${r.edge!=null?(+r.edge>0?'+':'')+(+r.edge).toFixed(4):'—'}</div>
      ${edgeChart(r.series, SERIES_KEYS, 130)}
    </div>`).join('');
  return $(`<section class="wide">
    <h2>Top ${t.n} by post-fee edge &middot; over time</h2>
    <div class="sub" style="margin-bottom:8px">${seriesLegend(SERIES_KEYS)}</div>
    ${blocks}
    <div class="sub">Our posted quote joined against the venue books, priced per route
      at every point either moved. The red line is zero — below it the basket loses.</div>
  </section>`);
}

async function reloadIntents(root){
  const d=await json('/api/intents');
  root.innerHTML='';
  setMeta(d.error ? 'engine not running'
    : `${d.resting_orders} resting &middot; ${d.pairs} pairs &middot; last ${dur(d.last_intent_age_s)} ago`);
  const t=await json('/api/top-series?n=4').catch(()=>({rows:[]}));
  root.append(topSeriesPanel(t));
  root.append(intentsPanel(d));
}

function currentPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Current opportunities</h2>
    <div class="err">${esc(d.error)}</div></section>`);
  const qs = new URLSearchParams(location.search);
  const tab = (k,l) => {
    const q = new URLSearchParams(qs); q.set('scenario', k);
    return `<a href="/current?${q}" class="${d.scenario===k?'on':''}">${l}</a>`;
  };
  const uq = new URLSearchParams(qs);
  if(d.only_tradable) uq.set('all','1'); else uq.delete('all');
  const universe = `<a href="/current?${uq}">${d.only_tradable?'show non-tradable too':'tradable only'}</a>`;
  const clips = [1,5,25,100].map(c=>{
    const q = new URLSearchParams(qs); q.set('clip', c);
    return `<a href="/current?${q}" class="${String(d.clip)===String(c)?'on':''}">${c}</a>`;
  }).join('');

  const rows = (d.rows||[]).map(r=>{
    const p = r.priced, e = Number(p.edge_per_contract);
    const stale = Math.max(r.quote_age_a_s, r.quote_age_b_s);
    // every scenario priced, so the alternatives are visible on the same row
    const alt = SCENARIOS.filter(([k])=>k!==d.scenario && r.scenarios[k])
      .map(([k,l])=>`${l} ${Number(r.scenarios[k].edge_per_contract).toFixed(4)}`).join('   ');
    return `<tr>
      <td><a class="rel" href="/pair/${encodeURIComponent(r.relationship_id)}">${esc(r.relationship_id)}</a>
          ${r.tradable?'':'<span class="dim">(not tradable)</span>'}</td>
      <td class="num">${Number(p.entry_a).toFixed(4)}</td>
      <td class="num">${Number(p.exit_b).toFixed(4)}</td>
      <td class="num dim">${Number(p.gross_cost).toFixed(4)}</td>
      <td class="num dim">${(Number(p.fee_a)+Number(p.fee_b)).toFixed(4)}</td>
      <td class="num">${Number(p.total_cost).toFixed(4)}</td>
      <td class="num ${e>0?(p.fill_plausible?'ok':'warn'):'bad'}">
        <b>${e>0?'+':''}${e.toFixed(4)}</b></td>
      <td class="num ${p.fill_plausible?'dim':'warn'}">${p.maker_spread!=null?Number(p.maker_spread).toFixed(3):'—'}</td>
      <td class="num ${stale>3600?'warn':'dim'}">${stale}s</td>
      <td class="dim" style="font-size:11px">${esc(alt)}</td>
    </tr>`;
  }).join('');

  return $(`<section class="wide">
    <h2>Current opportunities &middot; ${esc(d.day)}
      &middot; ${d.priced_pairs} priced
      &middot; <span class="${d.profitable?'dim':'dim'}">${d.profitable} profitable</span>
      &middot; <span class="${d.actionable?'ok':'warn'}">${d.actionable} actionable</span>
      &middot; <span class="dim">${d.only_tradable?'tradable only':'all pairs'}</span></h2>
    <nav style="padding:0;border:0;margin-bottom:6px">${SCENARIOS.map(([k,l])=>tab(k,l)).join('')}</nav>
    <div class="sub" style="margin-bottom:10px">clip size:
      <nav style="display:inline-flex;padding:0;border:0">${clips}</nav>
      &mdash; Kalshi ceils its fee to the cent PER ORDER, so per-contract cost
      genuinely changes with clip. &nbsp;&middot;&nbsp; ${universe}</div>
    <div class="scroll"><table>
      <thead><tr><th>relationship</th><th class="num">entry A</th><th class="num">exit B</th>
        <th class="num">gross</th><th class="num">fees</th><th class="num">total</th>
        <th class="num">edge/ct</th><th class="num">rest spread</th><th class="num">quote age</th>
        <th>other scenarios</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Edge = $1.00 &minus; total cost, per contract.
      Buy YES on leg A, buy NO on leg B; the basket pays $1.00 either way.
      Making rests on the near side and pays the maker fee (Kalshi 0.0175 vs 0.07
      taker; PM-US makers pay nothing) but is not a certain fill.
      Quotes are as fresh as the ToB rollup, not as fresh as the venue.<br>
      <b>Actionable</b> = profitable AND the leg we would rest on has a spread within
      ${esc(d.max_spread)}. Making is priced at the FAR touch, the optimistic bound:
      on a tight book that is about right, on a wide one it is fiction — resting an
      ask at 0.99 against a 0.40 bid does not fill. Amber rows are profitable but
      not plausibly fillable, and they sort below the actionable ones.</div>
  </section>`);
}

  const rows = (o.rows||[]).slice(0,25).map(r=>`<tr>

  return $(`<section class="wide">
    <h2>Opportunity coverage &middot; ${esc(o.from)} → ${esc(o.to)}
      &middot; ${o.days} day(s) &middot; ${o.relationships} pairs
      &middot; <span class="dim">${o.observations.toLocaleString()} obs in ${o.query_ms} ms</span></h2>
    <div class="scroll"><table>

      standing dislocation counts many times.</div>

}

/* Each view fetches ONLY its own endpoints. Splitting the page by URL is what
   keeps that true as views are added — a single page would fan out to every
   endpoint on every load. */
const ROUTES = {
  '/': async (root) => {
    const b = await json('/api/books');
    if(b.error) throw new Error(b.error);
    setMeta(`${b.entries} entries &middot; trial balance ` +
      `<span class="badge ${b.balanced?'ok':'bad'}">${b.balanced?'ZERO':'NOT ZERO'}</span>`);
    root.append(statement(b.statement));
    root.append(reconPanel(b.reconciliations));
    root.append(positionsPanel(b.positions||[]));
    root.append(accountsPanel(b.accounts||[]));

  '/recording': async (root) => {

    root.append(host); paintRollup(lastState.rollup_status || {});

  '/opportunities': async (root) => {

    setMeta(`${o.days||0} day(s) &middot; ${o.observations ? o.observations.toLocaleString() : 0} observations`);
    root.append(oppsPanel(o));
  },
};

function setMeta(html){
  document.getElementById('meta').innerHTML = html;
}

/* Which stream key each view depends on. A frame that does not move THIS
   view's key is not a reason to redraw it — which is the whole reason a push
   beats a timer: an idle board redraws nothing at all. */
const VIEW_TOPIC = {
  '/':'books', '/recording':'recording', '/opportunities':'opportunities',
  '/pairs':'pairs', '/current':'rollup', '/intents':'intents',
};

let lastState = {};       // most recent stream frame
let rendering = false;    // one render at a time; a redraw mid-render duplicates panels
let queued = false;

async function load(){
  if(rendering){ queued = true; return; }
  rendering = true;
  const root = document.getElementById('root');
  // A background redraw must not throw away where you were reading.
  const wasAt = window.scrollY;
  let path = location.pathname;
  const isPair = path.startsWith('/pair/');
  if(!isPair && !ROUTES[path]) path = '/';
  renderNav(isPair ? '/pairs' : path);
  try{
    root.innerHTML='';
    if(isPair){
      const rel = decodeURIComponent(path.slice('/pair/'.length));
      const qs = new URLSearchParams(location.search);
      qs.set('rel', rel);
      const d = await json('/api/pair?' + qs.toString());
      if(d.error) throw new Error(d.error);
      setMeta(`${d.samples_a + d.samples_b} quote samples across both legs`);
      pairPanels(d, root);
    } else {
      await ROUTES[path](root);
    }
  }catch(e){
    const msg = e.message || String(e);
    root.innerHTML = `<section class="wide err">${esc(msg)}</section>`;
    // The header must never keep describing the view that worked while the
    // body shows the one that did not.
    setMeta(`<span class="bad">${esc(msg)}</span>`);
  }finally{
    rendering = false;
    // The stream frame that carries the rollup can land while this render is
    // still building the panel, so paint it once more on the way out.
    paintRollup(lastState.rollup_status || {});
    if(wasAt) window.scrollTo(0, wasAt);
    if(queued){ queued = false; load(); }
  }
}

/* Server-pushed freshness. The old build re-ran the whole page on a 15s timer,
   which meant an idle dashboard hammered the box, a change waited up to 15s to
   appear, and anything you had opened was thrown away mid-read. */
function setLink(cls, text, title){
  const el = document.getElementById('link');
  el.className = 'sub ' + cls;
  el.textContent = text;
  el.title = title || '';
}

function connect(){
  const es = new EventSource('/api/stream');
  es.onopen = () => setLink('ok', '● live', 'pushed by the server as files change');
  es.onmessage = (ev) => {
    let s; try{ s = JSON.parse(ev.data); }catch{ return; }
    const prev = lastState; lastState = s;
    setLink('ok', '● live ' + new Date().toLocaleTimeString(),
            'time of the last change the server pushed');
    paintRollup(s.rollup_status || {});
    // The first frame is not news: the initial load() already read everything.
    if(!Object.keys(prev).length) return;
    // A pair drill-down is drawn from the ToB rollup, not the registry.
    const topic = location.pathname.startsWith('/pair/')
      ? 'rollup' : VIEW_TOPIC[location.pathname] || 'books';
    if(prev[topic] !== s[topic]) load();
  };
  es.onerror = () => setLink('bad', '● reconnecting…',
                             'the dashboard cannot reach the server');
}

load();
connect();
</script>
</body>
</html>
