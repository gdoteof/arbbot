<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arbbot books</title>
<style>
  :root{
    --bg:#0e1013; --panel:#161a20; --line:#242a33; --ink:#e6e9ef; --dim:#8b94a3;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --ink:#11151a; --dim:#5b6472;
           --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; --accent:#0969da; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:20px 24px 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.04em;text-transform:uppercase}
  .sub{color:var(--dim);font-size:12px}
  main{padding:8px 24px 48px;display:grid;gap:16px;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));max-width:1500px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  section.wide{grid-column:1/-1}
  h2{font-size:11px;margin:0 0 12px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;
     text-transform:uppercase;letter-spacing:.06em;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    border:1px solid currentColor}
  .big{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv b{font-weight:600;font-variant-numeric:tabular-nums}
  .rule{border-top:1px solid var(--line);margin:8px 0}
  .scroll{overflow-x:auto}
  .err{color:var(--bad);padding:12px}
  code{color:var(--accent)}
  a.rel{color:var(--accent);text-decoration:none}
  button{font:inherit;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
  button:disabled{color:var(--dim);border-color:var(--line);cursor:default}
  a.rel:hover{text-decoration:underline}
  nav{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav a{color:var(--dim);text-decoration:none;padding:8px 14px;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent}
  nav a:hover{color:var(--ink)}
  nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}

  /* --- now view --------------------------------------------------------- */
  .rowflex{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .banner{border:1px solid var(--warn);color:var(--warn);border-radius:6px;
    padding:9px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
  .banner code{color:inherit}
  .stat{min-width:96px}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .bar i.over{background:var(--bad)}
  .split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:4px 0 8px}
  .split i{display:block;height:100%}
  .split i.v-ok{background:var(--ok)} .split i.v-warn{background:var(--warn)}
  .split i.v-bad{background:var(--bad)} .split i.v-dim{background:var(--dim)}

  /* --- architecture diagram -------------------------------------------- */
  .arch{width:100%;height:auto;display:block;overflow:visible}
  .arch text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .arch .laneband{fill:var(--line);opacity:.16}
  .arch .lane{fill:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .arch .nbox{fill:var(--panel);stroke:var(--line);stroke-width:1}
  .arch .k-artifact .nbox{stroke-dasharray:4 3}
  .arch .k-part .nbox{stroke-dasharray:1 3}
  .arch .k-venue .nbox{fill:var(--bg)}
  .arch .st-down .nbox{stroke:var(--bad)}
  .arch .st-stale .nbox,.arch .st-alive .nbox{stroke:var(--warn)}
  .arch .nlabel{fill:var(--ink);font-size:12px;font-weight:600}
  .arch .nsub{fill:var(--dim);font-size:10px}
  .arch .nchip{font-size:10.5px;fill:var(--dim)}
  .arch .ntag{font-size:10px;font-weight:700;letter-spacing:.06em;fill:var(--warn)}
  .arch .c-down{fill:var(--bad)} .arch .c-stale,.arch .c-alive{fill:var(--warn)}
  .arch .b-live{fill:var(--ok)} .arch .b-stale,.arch .b-alive{fill:var(--warn)}
  .arch .b-down{fill:var(--bad)} .arch .b-off{fill:var(--dim)}
  .arch .d-live{fill:var(--ok)} .arch .d-stale,.arch .d-alive{fill:var(--warn)}
  .arch .d-down{fill:var(--bad)} .arch .d-off{fill:var(--dim)}
  .arch .e{fill:none;stroke-width:1.4}
  .arch .e.feed{stroke:var(--accent)}
  .arch .e.write{stroke:var(--ok)}
  .arch .e.read{stroke:var(--dim);stroke-dasharray:5 4}
  .arch .e.order{stroke:var(--warn);stroke-width:2.2}
  .arch .e.dead{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
  /* Arrowheads are styled through a CLASS, never a fill="var(--x)" attribute:
     a presentation attribute is not a CSS declaration and browsers do not
     resolve a custom property inside one. Every head rendered black. */
  .arch .m-feed{fill:var(--accent)} .arch .m-write{fill:var(--ok)}
  .arch .m-read{fill:var(--dim)}    .arch .m-order{fill:var(--warn)}
  .arch .m-dead{fill:var(--line)}
  /* The halo is what keeps a label readable where it sits on top of a line. */
  .arch .elabel{fill:var(--dim);font-size:9.5px;paint-order:stroke;
    stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .arch .flow{stroke-dasharray:6 8;animation:archflow 1.2s linear infinite}
  .arch .pulse{animation:archpulse 2.4s ease-in-out infinite}
  @keyframes archflow{to{stroke-dashoffset:-28}}
  @keyframes archpulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){
    .arch .flow,.arch .pulse{animation:none}
    .arch .flow{stroke-dasharray:none}
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:0;border-top-width:2px;
    border-top-style:solid;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>arbbot books</h1>
  <span class="sub" id="meta">loading…</span>
  <span class="sub" id="link" style="margin-left:auto">● connecting…</span>
</header>
<nav id="nav"></nav>
<main id="root"></main>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };

/* ---------------------------------------------------------------------------
   In-place DOM patching.

   Panels are still built as strings — that code is fine and readable. What
   changed is how the result is APPLIED: the new tree is diffed against the
   live one and only the differences are written. Nodes are never destroyed,
   so scroll position, focus, caret, text selection and :hover survive a
   repaint for free. The previous build replaced everything and then tried to
   put the scroll back by hand, which is exactly the jump you could see.

   Rows carry `data-k`; matching on it means a re-sort MOVES existing rows
   instead of rewriting every cell in the table.

   ~60 lines, no build step, no dependency — the alternative was a bundler and
   node_modules inside a Rust binary that ships its UI via include_str!.
   --------------------------------------------------------------------------- */
function morph(from, to){
  if(from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){
    from.replaceWith(to);
    return;
  }
  if(from.nodeType === Node.TEXT_NODE || from.nodeType === Node.COMMENT_NODE){
    if(from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
    return;
  }
  if(from.nodeType !== Node.ELEMENT_NODE) return;

  for(const a of Array.from(to.attributes))
    if(from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  for(const a of Array.from(from.attributes))
    if(!to.hasAttribute(a.name)) from.removeAttribute(a.name);

  // Never fight the user for a field they are typing in.
  if(from === document.activeElement && 'value' in from) return;
  if('value' in from && from.value !== to.value) from.value = to.value;

  morphChildren(from, to);
}

function morphChildren(from, to){
  const keyed = new Map();
  for(const c of Array.from(from.children))
    if(c.dataset && c.dataset.k != null) keyed.set(c.dataset.k, c);

  let cursor = from.firstChild;
  for(const n of Array.from(to.childNodes)){
    const k = (n.nodeType === Node.ELEMENT_NODE && n.dataset) ? n.dataset.k : null;
    let target = null;
    if(k != null && keyed.has(k)){
      target = keyed.get(k);
      keyed.delete(k);
    } else if(cursor && cursor.nodeName === n.nodeName &&
              !(cursor.nodeType === Node.ELEMENT_NODE && cursor.dataset &&
                cursor.dataset.k != null)){
      target = cursor;
    }
    if(target){
      if(target === cursor) cursor = cursor.nextSibling;
      else from.insertBefore(target, cursor);   // a keyed row that moved
      morph(target, n);
    } else {
      from.insertBefore(n, cursor);
    }
  }
  // Anything the new tree did not claim is at or after the cursor.
  while(cursor){ const next = cursor.nextSibling; from.removeChild(cursor); cursor = next; }
}

/* Apply a freshly built fragment to a live container. */
function apply(container, frag){
  const shell = document.createElement(container.nodeName);
  shell.append(frag);
  morphChildren(container, shell);
}
const money = (s) => {
  const n = Number(s);
  if (!isFinite(n)) return s;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const sign = (s) => Number(s) < 0 ? 'bad' : 'ok';
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* A dollar cell that refuses to invent a number. money(null) renders "0.00",
   and a 0.00 in a column of dollars reads as "nothing happened" rather than "we
   could not establish this" — that ambiguity is how 35 unpriceable ledger
   records were reported as $56 of profit (2026-07-28 audit). A value the server
   sent as null MUST look absent, and must carry the server's reason. */
const usd = (v, why) => (v===null||v===undefined||!isFinite(Number(v)))
  ? `<span class="warn" title="${esc(why||'not computable from the ledger')}">unknown</span>`
  : '$'+money(v);
const usdSign = (v) => (v===null||v===undefined||!isFinite(Number(v))) ? '' : sign(v);

function statement(st, accounts){
  const net = Number(st.net_vs_capital);
  // The realized line is a NET of several accounts, and one of them is an
  // unitemized plug an order of magnitude bigger than the total. Showing only
  // the net let a +$7 headline stand on a −$49 residual nobody had explained.
  const parts = (accounts||[]).filter(a=>a.account.startsWith('pnl:realized'));
  const breakdown = parts.length > 1 ? `<div class="sub" style="margin:2px 0 8px 12px">` +
    parts.map(a=>`<div class="kv" style="border:0;padding:2px 0">
      <span>${esc(a.account.replace('pnl:realized:',''))}</span>
      <b class="${sign(a.balance)}">$${money(a.balance)}</b></div>`).join('') +
    `<div style="margin-top:4px">an <b>unitemized</b> component is a residual, not a
      trade — the realized figure is only as good as that plug is small.</div></div>` : '';
  return $(`<section>
    <h2>Statement of position &middot; cost basis</h2>
    <div class="big ${net<0?'bad':'ok'}">${net<0?'−':'+'}$${money(Math.abs(net))}</div>
    <div class="sub" style="margin-bottom:10px">net versus capital in</div>
    <div class="kv"><span>capital in</span><b>$${money(st.capital_in)}</b></div>
    <div class="kv"><span>cash</span><b>$${money(st.cash)}</b></div>
    <div class="kv"><span>positions at cost</span><b>$${money(st.positions_at_cost)}</b></div>
    <div class="kv"><span>total assets</span><b>$${money(st.total_assets)}</b></div>
    <div class="rule"></div>
    <div class="kv"><span>trading (realized)</span>
      <b class="${sign(st.trading_realized)}">$${money(st.trading_realized)}</b></div>
    ${breakdown}
    <div class="kv"><span>fees</span><b class="bad">−$${money(st.fees)}</b></div>
    <div class="sub" style="margin-top:8px">
      <b>Not comparable to the Trades tab.</b> This is cost basis over venue
      snapshots; Trades is derived from the append-only ledger, includes
      unrealized profit on open baskets, and charges a different fee population.
      The PM-US half of realized is dominated by the <b>unitemized plug</b>, which
      is a single residual — it cannot tell one record's P&amp;L from another's, so
      a close match between the two figures is not evidence either is right.
    </div>
  </section>`);
}

function integrityPanel(iv){
  const feeds = (iv.live_feeds||[]).map(f=>`<tr>
      <td>${esc(f.stem)}</td>
      <td class="num">${(f.bytes/1e9).toFixed(2)} GB</td>
      <td class="num ${f.stale?'bad':'ok'}">${f.age_seconds}s</td>
    </tr>`).join('');
  /* Files another systemd unit is supposed to keep fresh. A dead timer is
     otherwise invisible here: on 2026-07-28 arbbot-marks.service had been
     exiting non-zero every 2 minutes for hours while the engine kept deriving
     its take-take APR bar from the frozen marks.json and reporting it as
     current. Nothing on this page said a word. */
  const derived = (iv.derived||[]).map(f=>`<tr>
      <td>${esc(f.what)}</td>
      <td class="num ${f.stale?'bad':'ok'}">${f.age_seconds===null?'missing':dur(f.age_seconds)}</td>
      <td class="num dim">${dur(f.max_age_seconds)}</td>
    </tr>`).join('');
  const warns = (iv.warnings||[]).map(w=>`<div class="warn">▲ ${esc(w)}</div>`).join('')
    || '<div class="ok">✓ no warnings</div>';
  return $(`<section>
    <h2>Recording integrity &middot; ${esc(iv.today)}</h2>
    <table><thead><tr><th>feed</th><th class="num">today</th><th class="num">age</th></tr></thead>
    <tbody>${feeds}</tbody></table>
    ${derived ? `<h2 style="margin-top:14px">Derived files &middot; is their writer alive</h2>
      <table><thead><tr><th>what</th><th class="num">age</th><th class="num">limit</th></tr></thead>
      <tbody>${derived}</tbody></table>` : ''}
    <div class="rule"></div>
    ${warns}
  </section>`);
}

/* "vs venue truth" was a promise the page could not keep: the Kalshi side is a
   number passed on the command line, so it cannot drift and the row read EXACT
   forever. Every input now carries where it came from and how old it is. */
/* A row that cannot fail is not a check and must not be painted like one. Both
   rows here read a green EXACT for every possible input: cash:pmus is forced
   equal to buyingPower by the import's plug entry, and cash:kalshi is compared
   against a number typed on the command line (2026-07-28 audit). They are kept
   because the figures are worth seeing, but they now say NOT A CHECK, and the
   server computes rows beside them that genuinely can fail. */
function reconPanel(b){
  const rs = b.reconciliations, sources = b.sources;
  if(!rs || !rs.length) return $(`<section><h2>Reconciliation</h2>
    <div class="dim">no venue balances supplied</div></section>`);
  const verdict = (r) => r.falsifiable === false
    ? `<span class="warn" title="${esc(r.why||'')}">NOT A CHECK</span>`
    : (r.exact ? '<span class="ok">EXACT</span>'
               : `<span class="bad">${money(r.diff)}</span>`);
  const rows = rs.map(r=>`<tr>
      <td>${esc(r.account)}<div class="sub">${esc(r.why||'')}</div></td>
      <td class="num">$${money(r.books)}</td>
      <td class="num">$${money(r.venue)}</td>
      <td class="num">${verdict(r)}</td>
    </tr>`).join('');
  const src = (sources||[]).map(s=>`<tr>
      <td>${esc(s.what)}</td>
      <td class="dim" style="font-size:11px">${esc(String(s.from).replace(/^.*\//,''))}</td>
      <td class="num ${s.frozen||s.stale?'warn':'dim'}">${dur(s.age_s)}${s.frozen?' fixed':(s.stale?' stale':'')}</td>
    </tr>`).join('');
  const anyFrozen = (sources||[]).some(s=>s.frozen);
  const nCheck = Number(b.checks_falsifiable||0), nFail = Number(b.checks_failed||0);
  return $(`<section>
    <h2>Reconciliation vs the last venue snapshot</h2>
    <div class="${nFail?'bad':(nCheck?'ok':'warn')}" style="margin-bottom:6px">
      ${nCheck ? `${nCheck} falsifiable check(s) &middot; <b>${nFail} failing</b>`
               : 'no falsifiable check on this page'}
    </div>
    <table><thead><tr><th>claim</th><th class="num">books</th>
      <th class="num">snapshot</th><th class="num">verdict</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="rule"></div>
    <h2>Where those numbers came from</h2>
    <table><thead><tr><th>input</th><th>source</th><th class="num">age</th></tr></thead>
      <tbody>${src}</tbody></table>
    ${b.snapshot_stale ? `<div class="bad" style="margin-top:8px">▲ The venue snapshot is
      <b>${dur(b.snapshot_age_s)}</b> old. Every verdict above is a statement about that
      snapshot, not about the account now — FROZEN, not passing.</div>` : ''}
    ${anyFrozen ? `<div class="warn" style="margin-top:8px">▲ Rows marked <b>fixed</b> were
      set on the command line when this process started. They cannot move, so matching
      them is not evidence the venue agrees — re-pull the snapshot and restart to
      actually check.</div>` : ''}
  </section>`);
}

function positionsPanel(ps){
  const rows = ps.map(p=>`<tr data-k="${esc(p.account)}">
      <td>${esc(p.venue)}</td>
      <td>${esc(p.market)}</td>
      <td class="num ${Number(p.qty)<0?'warn':''}">${Number(p.qty).toLocaleString()}</td>
      <td class="num">$${money(p.cost)}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Open positions &middot; ${ps.length}</h2>
    <div class="scroll"><table>
      <thead><tr><th>venue</th><th>market</th><th class="num">qty</th>
        <th class="num">cost basis</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">negative qty = short (the hedge leg).
      Both venues withhold $1.00/contract, already inside the cost basis.</div>
  </section>`);
}

function accountsPanel(as_){
  const rows = as_.map(a=>`<tr data-k="${esc(a.account)}">
      <td>${esc(a.account)}</td>
      <td class="num ${sign(a.balance)}">$${money(a.balance)}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Trial balance &middot; all accounts</h2>
    <div class="scroll"><table>
      <thead><tr><th>account</th><th class="num">balance</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>`);
}

function coveragePanel(iv){
  const rows=(iv.coverage||[]).slice().reverse().map(c=>`<tr>
      <td>${esc(c.stem)}</td><td>${esc(c.day)}</td>
      <td class="num">${c.jsonl_bytes==null?'<span class="dim">—</span>':(c.jsonl_bytes/1e9).toFixed(2)+' GB'}</td>
      <td class="num">${c.parquet_bytes==null?'<span class="dim">—</span>':(c.parquet_bytes/1e6).toFixed(0)+' MB'}</td>
      <td class="num ${c.unarchived?'bad':'ok'}">${c.unarchived?'UNARCHIVED':'ok'}</td>
    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Archive coverage &middot; ${iv.unarchived_days} unarchived day(s),
      ${(iv.unarchived_bytes/1e9).toFixed(1)} GB still raw</h2>
    <div class="scroll"><table>
      <thead><tr><th>stem</th><th>day</th><th class="num">jsonl</th>
        <th class="num">parquet</th><th class="num">state</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">A closed day with no COMPLETE Parquet
      failed to archive &mdash; a file that exists is not one that reads. Today is
      legitimately raw-only.</div>
  </section>`);
}


/* Hand-rolled inline SVG. A localhost instrument does not justify a charting
   dependency, and the existing Python dash already draws this way. */
function costChart(points, maxAgeS){
  const maxAge = (maxAgeS||300) * 1e9;
  const fresh = p => p.age_a_ns != null && p.age_b_ns != null &&
                     p.age_a_ns <= maxAge && p.age_b_ns <= maxAge;
  const pts = points.filter(p => p.basket_cost != null);
  if(!pts.length) return '<div class="dim" style="padding:24px 0">no overlapping quotes in range</div>';
  const W=1100, H=280, PL=54, PR=14, PT=14, PB=26;
  const xs = pts.map(p=>p.ts_local_ns);
  const ys = pts.map(p=>p.basket_cost);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys, 1.0), y1=Math.max(...ys, 1.0);
  const pad=(y1-y0)*0.08 || 0.02; y0-=pad; y1+=pad;
  const sx = t => PL + (W-PL-PR) * (x1===x0 ? 0.5 : (t-x0)/(x1-x0));
  const sy = v => PT + (H-PT-PB) * (1 - (v-y0)/(y1-y0));
  const line = pts.map((p,i)=>`${i?'L':'M'}${sx(p.ts_local_ns).toFixed(1)},${sy(p.basket_cost).toFixed(1)}`).join('');
  const yOne = sy(1.0);
  // Shade below $1.00 — that band IS the arb, gross of fees.
  // Shade only where BOTH legs were fresh. A forward-filled point is drawn as
  // a line but never as claimed arbitrage.
  const fp = pts.filter(fresh);
  const area = fp.length ? `M${sx(fp[0].ts_local_ns).toFixed(1)},${yOne} ` +
    fp.map(p=>`L${sx(p.ts_local_ns).toFixed(1)},${Math.max(sy(p.basket_cost),0).toFixed(1)}`).join('') +
    ` L${sx(fp[fp.length-1].ts_local_ns).toFixed(1)},${yOne} Z` : '';
  const dots = pts.filter(p=>!fresh(p)).map(p=>
    `<circle cx="${sx(p.ts_local_ns).toFixed(1)}" cy="${sy(p.basket_cost).toFixed(1)}" r="1.6"
       fill="var(--dim)" opacity="0.7"/>`).join('');
  const ticks=[y0,(y0+y1)/2,y1,1.0].map(v=>
    `<line x1="${PL}" x2="${W-PR}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"
       stroke="var(--line)" stroke-dasharray="${Math.abs(v-1)<1e-9?'0':'2,4'}"
       stroke-width="${Math.abs(v-1)<1e-9?1.4:1}"/>
     <text x="6" y="${(sy(v)+4).toFixed(1)}" fill="var(--dim)" font-size="11">$${v.toFixed(3)}</text>`).join('');
  const t0=new Date(x0/1e6).toLocaleString(), t1=new Date(x1/1e6).toLocaleString();
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <clipPath id="below"><rect x="${PL}" y="${yOne}" width="${W-PL-PR}" height="${H}"/></clipPath>
    ${ticks}
    <path d="${area}" fill="var(--ok)" opacity="0.16" clip-path="url(#below)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    ${dots}
    <text x="${PL}" y="${H-6}" fill="var(--dim)" font-size="11">${esc(t0)}</text>
    <text x="${W-PR}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="end">${esc(t1)}</text>
  </svg>`;
}

        : 'Exactly one point in this range had both legs quoting inside ' + d.fresh_max_age_s

/* 143 rows of registry, unsorted and unsearchable, with 78-digit Polymarket
   token ids in the legs column. Finding one pair meant ctrl-F. */
function pairsPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Pairs</h2><div class="err">${esc(d.error)}</div></section>`);
  const q = S.pairQuery.trim().toLowerCase();
  const match = r => !q || [r.id, r.verdict, r.vetted_by, ...(r.legs||[])]

  const shown = (d.rows||[]).filter(match);
  const rows=shown.map(r=>`<tr data-k="${esc(r.id)}">
      <td><a class="rel" href="/pair/${encodeURIComponent(r.id)}">${esc(r.id)}</a></td>
      <td>${esc(r.verdict||'—')}</td>
      <td>${esc(r.vetted_by||'—')}${r.tradable && !r.human_vetted ? ' <span class="dim">+allowlist</span>' : ''}</td>
      <td class="num ${r.tradable?'ok':'dim'}">${r.tradable?'yes':'no'}</td>
      <td class="dim">${(r.legs||[]).length>2 ? (r.legs.length+' legs') : esc((r.legs||[]).map(l=>l.length>44?l.slice(0,44)+'…':l).join('  |  '))}</td>
    </tr>`).join('');
  const el = $(`<section class="wide">
    <h2>Tracked pairs &middot; ${d.count} registered &middot; ${d.tradable} tradable
      <span class="dim">(${d.human_vetted} by human verdict, ${d.allowlisted}
        id(s) in the allowlist — the two overlap)</span>
      ${q?`&middot; <span class="ok">${shown.length} match "${esc(q)}"</span>`:''}</h2>
    <input id="pair-q" placeholder="filter by id, verdict, vetter or leg…"
      value="${esc(S.pairQuery)}" style="width:100%;max-width:420px;margin-bottom:10px;
      font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;
      background:var(--bg);color:var(--ink);border:1px solid var(--line)">
    ${shown.length?'':'<div class="dim" style="padding:8px 0">no pair matches that.</div>'}
    <div class="scroll"><table>
      <thead><tr><th>relationship</th><th>verdict</th><th>vetted by</th>

      <tbody>${rows}</tbody></table></div>
  </section>`);
  const inp = el.querySelector('#pair-q');

  inp.oninput = () => set(st => { st.pairQuery = inp.value; });

const SCENARIOS = [
  ['take-take',     'take / take'],
  ['make-a-take-b', 'make A / take B'],
  ['take-a-make-b', 'take A / make B'],
];

/* Polymarket INTERNATIONAL taker fees run 0.00 (geopolitics) to 0.07 (crypto)
   by market category. The scanner reads that category off market metadata;
   this dashboard has no access to it and prices every intl leg at the 0.04
   default. That is not a neutral assumption, so rows it applies to say so. */
function intlNote(rows){
  const n = (rows||[]).filter(r=>r.intl_leg).length;
  if(!n) return '';
  return `<b>${n} row(s) have a Polymarket <i>international</i> leg (marked ⌁).</b> Its taker
    fee depends on the market's category — 0.00 geopolitics, 0.04 politics/finance/tech,
    0.05 sports/economics/weather, 0.07 crypto — and this view does not have the
    per-market category, so it prices them all at the 0.04 default. Edge on a crypto or
    sports pair is therefore overstated, and on a geopolitics pair understated.`;
}

/* The dashboard's ONLY write. POST so nothing fires it by loading a page;
   the server refuses a second concurrent build and writes atomically. */
function rollupPanel(st, day){
  const running = st.running;
  const l = st.last;
  // What is ON DISK is the fact that matters; "no build this session" said
  // nothing about the series every other view is reading.
  const age = st.built_age_s;
  const onDisk = st.on_disk
    ? `<span class="${age>1800?'warn':'ok'}">series for ${esc(st.day||'')} built
       ${dur(age)} ago</span>`
    : `<span class="bad">no series on disk for ${esc(st.day||'today')}</span>`;
  const summary = l ? (l.ok
    ? `${onDisk} <span class="dim">&middot; last build here: ${l.samples.toLocaleString()}
       samples from ${l.events.toLocaleString()} events in ${l.elapsed_s}s</span>`
    : `${onDisk} <span class="bad">&middot; last build here failed: ${esc(l.error||'')}</span>`)
    : onDisk;
  const el = $(`<section class="wide">
    <h2>Top-of-book rollup</h2>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button id="rollup-btn" ${running?'disabled':''}>
        ${running?`building ${esc(running)}…`:`rebuild ${esc(day)}`}</button>
      <span class="sub">${summary}</span>
    </div>
    <div class="sub" style="margin-top:8px">Replays the day's tape through a book
      builder to produce the quote series the pair and current views read.
      Costs ~30s on two cores and under 40 MB of memory; it streams, so it does
      not scale with tape size. Writes are atomic — readers never see a partial
      series.</div>
  </section>`);
  // Dispatches an action. The button's own state comes back through the
  // stream, so nothing here writes to the document.
  el.querySelector('#rollup-btn').onclick = () => startRollup(day);
  return el;
}

/* Human-readable duration. "48054s" is a number; "13h 21m" is a fact. */
function dur(sec){
  if(sec==null||sec<0) return '—';
  const s=Math.round(sec);
  if(s<60) return s+'s';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return r?`${m}m ${r}s`:`${m}m`;
  const h=Math.floor(m/60), rm=m%60;
  if(h<24) return rm?`${h}h ${rm}m`:`${h}h`;
  const d=Math.floor(h/24); return `${d}d ${h%24}h`;
}

/* Coverage is per VENUE, so the badge is too. One recorder dying leaves the
   other venues sampling, and a single ROLLUP CURRENT badge off the newest
   sample anywhere said "go" over a six-hour-dead book. Green = covering now,
   red = covering but behind, amber = no coverage at all — which is a different
   fact and gets a different colour.

   Amber says which REPAIR, because the two ways to have no coverage take
   opposite ones. NO ROLLUP: the venue is not in the rollup, so rebuild it.
   UNSUBSCRIBED: the rollup is being written for this venue and holds not one
   market the registry names, so the recorder's subscription is what is short —
   rebuilding replays the same markets and changes nothing. Not "NO BOOK",
   which is what the banner below calls a single missing market. */
function venueChips(vs){
  return (vs||[]).map(v=>{
    const cls = v.current ? 'ok' : (v.coverage_age_s<0 ? 'warn' : 'bad');
    const age = v.coverage_age_s>=0 ? dur(v.coverage_age_s)
              : (v.recorded ? 'UNSUBSCRIBED' : 'NO ROLLUP');
    return `<span class="badge ${cls}">${esc(v.venue)} ${age}</span>`;
  }).join(' ');
}
/* The venues whose books we price are absent while their tape is still being
   written: a rebuild would replay the same markets, so the banner must not ask
   for one. */
const unsubscribedVenues = (d) => (d.venues||[])
  .filter(v=>v.coverage_age_s<0 && v.recorded).map(v=>v.venue);

/* A row's coverage cell. -1 is NO coverage on one of its venues, not a small
   age: `dur()` renders it as an em dash, which in a numeric column reads like
   "nothing to report" — the opposite of what it means. It is the reason the
   row can never be actionable, so it is spelled and it is red.

   `covSort` is why -1 is not enough on its own: sorted as a number it is the
   SMALLEST, so ascending by coverage put the venues we know nothing about above
   a genuine 5s. No evidence is the stalest thing on the board, so it sorts as
   the stalest. MAX_SAFE_INTEGER and not Infinity: the comparator below maps
   every non-finite value to -Infinity, which is the bug this line fixes. */
const covCls  = (r,d) =>
  (r.coverage_age_s<0 || r.coverage_age_s>d.max_coverage_age_s ? 'bad' : 'dim');
const covText = (r) => r.coverage_age_s<0 ? 'none' : dur(r.coverage_age_s);
const covSort = (r) => r.coverage_age_s<0 ? Number.MAX_SAFE_INTEGER : r.coverage_age_s;
const staleVenues = (d) => (d.venues||[]).filter(v=>!v.current && v.coverage_age_s>=0)
  .map(v=>v.venue);

/* A pair the rollup has no book for is not evaluated AT ALL, and a view that
   silently shrinks reads as "no edge" rather than "no data" — the same lie as a
   green badge over a dead book, pointing the other way. The per-venue counts do
   not partition the total: a pair missing BOTH books is one pair and two broken
   venues, so they can sum higher, and the wording never claims otherwise. */
function unevalBanner(d, noun, evaluated){
  const by = d.unevaluated_by_venue || {};
  const parts = Object.keys(by).map(v=>`${by[v]} missing a ${esc(v)} book`);
  if(!parts.length) return '';
  // The remedy, not a generic one: a rollup that is being written and carries
  // none of our markets is a subscription that stopped covering them, and
  // "rebuild the rollup" sends the operator to replay the same tape.
  const unsub = unsubscribedVenues(d).filter(v=>by[v]);
  const fix = unsub.length
    ? `The ${unsub.join(' and ')} rollup is being written but holds no market any pair
       names, so it is the recorder's subscription that no longer covers them — rebuilding
       the rollup would replay the same markets.`
    : 'Rebuild the rollup above.';
  return `<div class="warn" style="margin-bottom:8px">▲ ${d.unevaluated_pairs} ${noun} were
    NOT evaluated (${parts.join(', ')}). They are absent from every count above, including
    &ldquo;${d.actionable} actionable&rdquo; — that number is about the ${evaluated} pair(s)
    that had books, not the whole set. ${fix}</div>`;
}

const ROUTE_LABEL={'take-take':'take / take','make-a-take-b':'make A → take B',
                   'take-a-make-b':'take A → make B','none':'—'};
const SERIES_KEYS=[['take_take','take/take','var(--accent)'],
                   ['make_a_take_b','make A → take B','var(--ok)'],
                   ['take_a_make_b','take A → make B','var(--warn)']];

/* Multi-series edge-over-time chart. Zero line drawn because the sign is the
   whole question: above it the basket pays, below it we would be buying a loss. */
function edgeChart(series, keys, height){
  const H=height||190, W=1100, PL=58, PR=14, PT=12, PB=24;
  const pts=[];
  keys.forEach(([k],i)=>series.forEach(r=>{ if(r[k]!=null) pts.push([r.ts, r[k], i]); }));
  if(!pts.length) return '<div class="dim" style="padding:16px 0">not enough overlap to price a route yet</div>';
  const x0=Math.min(...pts.map(p=>p[0])), x1=Math.max(...pts.map(p=>p[0]));
  let y0=Math.min(0,...pts.map(p=>p[1])), y1=Math.max(0,...pts.map(p=>p[1]));
  const pad=(y1-y0)*0.1||0.01; y0-=pad; y1+=pad;
  const sx=t=>PL+(W-PL-PR)*(x1===x0?0.5:(t-x0)/(x1-x0));
  const sy=v=>PT+(H-PT-PB)*(1-(v-y0)/(y1-y0));
  const lines=keys.map(([k,,col],i)=>{
    const sub=series.filter(r=>r[k]!=null);
    if(!sub.length) return '';
    const d=sub.map((r,j)=>`${j?'L':'M'}${sx(r.ts).toFixed(1)},${sy(r[k]).toFixed(1)}`).join('');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.95"/>`;
  }).join('');
  const zero=sy(0);
  const tick=v=>`<line x1="${PL}" x2="${W-PR}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}"
     stroke="var(--line)" stroke-dasharray="2,4"/><text x="4" y="${(sy(v)+4).toFixed(1)}"
     fill="var(--dim)" font-size="11">${v>0?'+':''}${v.toFixed(3)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${tick(y0+pad)}${tick(y1-pad)}
    <line x1="${PL}" x2="${W-PR}" y1="${zero}" y2="${zero}" stroke="var(--bad)" stroke-width="1.2" opacity="0.8"/>
    <text x="4" y="${(zero+4).toFixed(1)}" fill="var(--bad)" font-size="11">0</text>
    ${lines}
    <text x="${PL}" y="${H-4}" fill="var(--dim)" font-size="11">${new Date(x0*1000).toLocaleTimeString()}</text>
    <text x="${W-PR}" y="${H-4}" fill="var(--dim)" font-size="11" text-anchor="end">${new Date(x1*1000).toLocaleTimeString()}</text>
  </svg>`;
}

function seriesLegend(keys){
  return keys.map(([,l,c])=>`<span style="color:${c}">■</span> <span class="dim">${l}</span>`).join(' &nbsp; ');
}

/* Our posted quote over time, with post-fee edge on its OWN axis — the two
   have different units and ranges, so sharing one axis would flatten both. */
function quoteAndEdgeChart(ev, series){
  const q=ev.filter(e=>e.kind!=='cancel' && e.price);
  if(!q.length) return '<div class="dim">no quote history</div>';
  const W=1100,H=210,PL=58,PR=58,PT=12,PB=24;
  const xs=q.map(p=>p.ts).concat(series.map(r=>r.ts));
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const sx=t=>PL+(W-PL-PR)*(x1===x0?0.5:(t-x0)/(x1-x0));
  let qy0=Math.min(...q.map(p=>+p.price)), qy1=Math.max(...q.map(p=>+p.price));
  const qp=(qy1-qy0)*0.15||0.02; qy0-=qp; qy1+=qp;
  const syq=v=>PT+(H-PT-PB)*(1-(v-qy0)/(qy1-qy0));
  const evals=[]; SERIES_KEYS.forEach(([k])=>series.forEach(r=>{if(r[k]!=null)evals.push(r[k]);}));
  let ey0=evals.length?Math.min(0,...evals):0, ey1=evals.length?Math.max(0,...evals):0.01;
  const ep=(ey1-ey0)*0.15||0.01; ey0-=ep; ey1+=ep;
  const sye=v=>PT+(H-PT-PB)*(1-(v-ey0)/(ey1-ey0));
  const keys=[...new Set(q.map(p=>`${p.venue}|${p.market}|${p.side}`))];
  const cols=['var(--accent)','var(--ok)'];
  const qlines=keys.map((k,i)=>{
    const sub=q.filter(p=>`${p.venue}|${p.market}|${p.side}`===k);
    const d=sub.map((p,j)=>`${j?'L':'M'}${sx(p.ts).toFixed(1)},${syq(+p.price).toFixed(1)}`).join('');
    const dots=sub.map(p=>`<circle cx="${sx(p.ts).toFixed(1)}" cy="${syq(+p.price).toFixed(1)}" r="2" fill="${cols[i%2]}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${cols[i%2]}" stroke-width="1.4"/>${dots}`;
  }).join('');
  const elines=SERIES_KEYS.map(([k,,col])=>{
    const sub=series.filter(r=>r[k]!=null);
    if(!sub.length) return '';
    const d=sub.map((r,j)=>`${j?'L':'M'}${sx(r.ts).toFixed(1)},${sye(r[k]).toFixed(1)}`).join('');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.3" stroke-dasharray="4,3" opacity="0.9"/>`;
  }).join('');
  const legend=keys.map((k,i)=>{const[,m,side]=k.split('|');
    return `<span style="color:${cols[i%2]}">■</span> <span class="dim">${esc(m.slice(0,26))} ${esc(side)}</span>`}).join(' &nbsp; ');
  return `<div class="sub" style="margin-bottom:6px">${legend} &nbsp;|&nbsp; dashed = post-fee edge (right axis): ${seriesLegend(SERIES_KEYS)}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <text x="4" y="${PT+10}" fill="var(--dim)" font-size="11">${qy1.toFixed(2)}</text>
    <text x="4" y="${H-PB}" fill="var(--dim)" font-size="11">${qy0.toFixed(2)}</text>
    <text x="${W-PR+6}" y="${PT+10}" fill="var(--dim)" font-size="11">${ey1>0?'+':''}${ey1.toFixed(3)}</text>
    <text x="${W-PR+6}" y="${H-PB}" fill="var(--dim)" font-size="11">${ey0.toFixed(3)}</text>
    <line x1="${PL}" x2="${W-PR}" y1="${sye(0)}" y2="${sye(0)}" stroke="var(--bad)" stroke-width="1" opacity="0.6"/>
    ${qlines}${elines}
    <text x="${PL}" y="${H-4}" fill="var(--dim)" font-size="11">${new Date(x0*1000).toLocaleTimeString()}</text>
    <text x="${W-PR}" y="${H-4}" fill="var(--dim)" font-size="11" text-anchor="end">${new Date(x1*1000).toLocaleTimeString()}</text>
  </svg>`;
}

const COLS=[
  ['relationship_id','relationship','The vetted pair. Click the row for its history.','s'],
  ['best_route','route','Best available route now. take/take crosses both books immediately; make→take rests one leg and takes the other the moment it fills.','s'],
  ['our_a','our bid A','Our resting BID on leg A — the price we would buy YES at if hit.','n'],
  ['venue_a','venue A','Leg A book, bid/ask.','x'],
  ['our_b','our ask B','Our resting ASK on leg B — the price we would sell YES at if hit.','n'],
  ['venue_b','venue B','Leg B book, bid/ask.','x'],
  ['gross','gross','Basket cost before fees: entry A + (1 − exit B). Below 1.00 is an arb gross.','n'],
  ['fee_a','fee A','Per-contract fee on leg A at clip 25. Kalshi maker 0.0175 vs taker 0.07, ceiled per ORDER.','n'],
  ['fee_b','fee B','Per-contract fee on leg B. PM-US makers pay nothing.','n'],
  ['edge_f','post-fee edge','$1.00 − total cost, per contract. This is the number that matters.','n'],
  ['rest_spread','rest spread','Spread on the leg we rest on. A wide book means the fill is a coin flip, so the edge is not obtainable.','n'],
  ['take_depth','take depth','Contracts resting at the touch on the leg(s) this route CROSSES. Below the clip, the price shown is only good for part of the order. "?" means the tape carried no size.','n'],
  ['reprices','reprices','Times the quote has been moved. High means the quoter is chasing, which is a cost.','n'],
  ['since_change_s','since move','Time since this book last MOVED. Not staleness — the series emits on change, so a quiet market has an old sample and a valid quote.','n'],
  ['coverage_age_s','coverage','How far the ROLLUP covers on the older of this row\'s two venues. THIS is the staleness flag, not "since move": past the limit the row is history and cannot be actionable.','n'],
];

function intentsPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Engine intents</h2>
    <div class="err">${esc(d.error)}</div>
    <div class="sub" style="margin-top:8px">${esc(d.hint||'')}</div></section>`);
  const n=(v,dp=4)=> v==null||v===''? '<span class="dim">—</span>' : Number(v).toFixed(dp);
  const val=(r,k)=>({
    relationship_id:r.relationship_id, best_route:r.best_route,
    our_a:r.leg_a.our_bid, venue_a:r.leg_a.venue_bid, our_b:r.leg_b.our_ask,
    venue_b:r.leg_b.venue_bid,
    gross:r.priced?+r.priced.gross_cost:null, fee_a:r.priced?+r.priced.fee_a:null,
    fee_b:r.priced?+r.priced.fee_b:null, edge_f:r.edge_f,
    rest_spread:r.rest_spread, take_depth:r.take_depth,
    reprices:(r.leg_a.reprices??0)+(r.leg_b.reprices??0),
    since_change_s:r.since_change_s, coverage_age_s:covSort(r),
  })[k];

  const all=(d.rows||[]).slice();
  let rows=all;
  if(S.filter.route) rows=rows.filter(r=>r.best_route===S.filter.route);
  if(S.filter.actionable) rows=rows.filter(r=>r.actionable);
  if(S.filter.tradable) rows=rows.filter(r=>r.tradable);
  // Prices arrive as strings, so a plain typeof check sorted "our bid A" and
  // both venue columns LEXICALLY: 0.09 above 0.1, and blanks first.
  const numeric = (COLS.find(c=>c[0]===S.sort.key)||[])[3] !== 's';
  rows.sort((a,b)=>{
    const x=val(a,S.sort.key), y=val(b,S.sort.key);
    if(!numeric) return String(x??'').localeCompare(String(y??''))*S.sort.dir;
    const nx=x==null||x===''?-Infinity:Number(x), ny=y==null||y===''?-Infinity:Number(y);
    const fx=isFinite(nx)?nx:-Infinity, fy=isFinite(ny)?ny:-Infinity;
    return (fy-fx)*(S.sort.dir<0?1:-1);
  });

  const head=COLS.map(([k,l,tip])=>{
    const on=S.sort.key===k;
    return `<th class="${['n','x'].includes(COLS.find(c=>c[0]===k)[3])?'num':''} sortable" data-key="${k}" title="${esc(tip)}">
      ${l}${on?(S.sort.dir<0?' ▾':' ▴'):''}</th>`;
  }).join('');

  const body=rows.map(r=>{
    const e=r.edge_f, p=r.priced;
    return `<tr class="irow" data-k="${esc(r.relationship_id)}" data-rel="${esc(r.relationship_id)}" style="cursor:pointer">
      <td><span class="rel">${esc(r.relationship_id)}</span>
        ${r.intl_leg?'<span class="warn" title="Polymarket international leg: fee priced at the 0.04 default, not this market\'s category">⌁</span>':''}
        ${r.tradable?'':'<span class="dim">(not tradable)</span>'}</td>
      <td class="dim">${esc(ROUTE_LABEL[r.best_route]||r.best_route)}</td>
      <td class="num">${n(r.leg_a.our_bid)}</td>
      <td class="num dim">${n(r.leg_a.venue_bid,2)}/${n(r.leg_a.venue_ask,2)}</td>
      <td class="num">${n(r.leg_b.our_ask)}</td>
      <td class="num dim">${n(r.leg_b.venue_bid,2)}/${n(r.leg_b.venue_ask,2)}</td>
      <td class="num dim">${p?n(p.gross_cost):'—'}</td>
      <td class="num dim">${p?n(p.fee_a):'—'}</td>
      <td class="num dim">${p?n(p.fee_b):'—'}</td>
      <td class="num ${e==null?'dim':(e>0?(r.actionable?'ok':'warn'):'bad')}">
        <b>${e==null?'—':(e>0?'+':'')+e.toFixed(4)}</b></td>
      <td class="num ${r.fillable?'dim':'warn'}">${r.rest_spread==null?'—':r.rest_spread.toFixed(3)}</td>
      <td class="num ${r.deep_enough?'dim':'warn'}">${r.take_depth==null?'?':Math.floor(r.take_depth).toLocaleString()}</td>
      <td class="num dim">${(r.leg_a.reprices??0)+(r.leg_b.reprices??0)}</td>
      <td class="num dim">${dur(r.since_change_s)}</td>
      <td class="num ${covCls(r,d)}" title="${esc(r.leg_a.venue)} / ${esc(r.leg_b.venue)}">${covText(r)}</td>
    </tr>${S.expanded===r.relationship_id ? expanderRow(r.relationship_id) : ''}`;}).join('');

  // An empty table is a claim, and it must say which claim. Filters hiding
  // everything and a stale rollup hiding everything look identical otherwise —
  // this view showed a bare header strip and nothing else for hours.
  const hidden = all.length - rows.length;
  const why = rows.length ? '' : `<div class="warn" style="padding:10px 0">▲ Nothing to show.
    ${all.length === 0
      ? 'The engine is resting ' + d.resting_orders + ' order(s), but none of them are on a '
        + 'pair with both books in the rollup.'
      // The remedy belongs to the branch that diagnosed the problem. Chosen
      // independently, "it is the subscription, not the rollup" lands on a
      // STALE venue whose rollup genuinely does need rebuilding, the moment one
      // venue is behind and another is unsubscribed.
      : (!d.rollup_current
        ? 'All ' + all.length + ' pair(s) are filtered out, and ' + (staleVenues(d).length
            ? 'no pair with a ' + staleVenues(d).join(' or ') + ' leg can be actionable '
              + 'while that rollup is ' + dur(d.rollup_coverage_age_s) + ' behind — rebuild it '
              + 'above'
            : 'nothing can be actionable while the rollup carries no book for any pair we quote'
              + ' — ' + (unsubscribedVenues(d).length
                ? 'the tape for ' + unsubscribedVenues(d).join(' and ') + ' is still being '
                  + 'written, so it is the subscription that stopped covering our markets, '
                  + 'not the rollup'
                : 'rebuild it above'))
          + ', or turn off <b>actionable only</b> to see the pairs as last priced.'
        : 'All ' + all.length + ' pair(s) are hidden by the filters above.')}</div>`;

  const rbtn=(k,l)=>`<a href="#" data-route="${k}" class="rf ${S.filter.route===k?'on':''}">${l}</a>`;
  const el=$(`<section class="wide">
    <h2>Engine intents &middot; ${d.resting_orders} resting &middot; ${rows.length}/${d.pairs} shown
      &middot; <span class="${d.actionable?'ok':'warn'}">${d.actionable} actionable</span>
      &middot; <span class="badge ${d.engine_live?'ok':'bad'}">${d.engine_live?'ENGINE LIVE':'NOT RUNNING'}</span>
      &middot; ${venueChips(d.venues)}
      <span class="dim">last ${dur(d.last_intent_age_s)} ago &middot; clip ${d.clip}</span></h2>
    <nav style="padding:0;border:0;margin-bottom:8px">
      ${rbtn('','all routes')}${rbtn('take-take','take / take')}${rbtn('make-a-take-b','make A → take B')}${rbtn('take-a-make-b','take A → make B')}
      <span style="flex:1"></span>
      <a href="#" id="f-act" class="${S.filter.actionable?'on':''}">actionable only</a>
      <a href="#" id="f-trd" class="${S.filter.tradable?'on':''}">tradable only</a>
    </nav>
    ${unevalBanner(d, 'pair(s) the engine is resting on', d.pairs)}
    ${why}
    <div class="scroll" style="${rows.length?'':'display:none'}"><table>
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Click a header to sort, a row for its history.
      The stream is MAKER-ONLY — a take-take crossing is an immediate execution, never a
      resting quote — so take/take here is priced off the venue books as the
      cross-now alternative. Resting on BOTH legs is not make/make: it is two entry
      points, whichever side gets hit first.<br>
      <b>Actionable</b> = positive edge, the rested leg's book within ${d.max_rest_spread},
      at least ${d.min_take_depth} contracts resting at the touch we would cross, both
      books known, and BOTH of the row's venues covered by the rollup within the last
      ${(d.max_coverage_age_s/60)|0} minutes — that last one is the <b>coverage</b> column,
      which is the older of the row's two venues and turns red when it is past the limit.<br>
      ${intlNote(d.rows)}</div>
  </section>`);

  // Every handler dispatches an action. None of them writes to the document.
  el.querySelectorAll('.sortable').forEach(th=>th.onclick=()=>set(st=>{
    const k=th.dataset.key;
    st.sort = (st.sort.key===k) ? {key:k, dir:-st.sort.dir} : {key:k, dir:-1};
  }));
  el.querySelectorAll('.rf').forEach(a=>a.onclick=e=>{
    e.preventDefault(); set(st=>{ st.filter.route = a.dataset.route; });});
  el.querySelector('#f-act').onclick=e=>{
    e.preventDefault(); set(st=>{ st.filter.actionable = !st.filter.actionable; });};
  el.querySelector('#f-trd').onclick=e=>{
    e.preventDefault(); set(st=>{ st.filter.tradable = !st.filter.tradable; });};
  el.querySelectorAll('.irow').forEach(tr=>tr.onclick=()=>toggleExpand(tr.dataset.rel));
  el.querySelectorAll('.ser-close').forEach(a=>a.onclick=e=>{
    e.preventDefault(); e.stopPropagation(); set(st=>{ st.expanded = null; });});
  return el;
}

/* The drill-down, rendered from state directly beneath the row it belongs to.
   Previously it lived in a host at the bottom of the section and was written
   by an async callback AFTER the patch had run — so the patch cleared the live
   chart and the fetch resolved into a node no longer in the document. Drawing
   it from `S.series` makes that impossible: a render mid-flight simply draws
   the loading state, and the reply triggers another render. */
function expanderRow(rel){
  const st = S.series[rel];
  const body = !st || st.loading
    ? '<div class="dim">loading…</div>'
    : st.error
      ? `<div class="err">${esc(st.error)}</div>`
      : `<div class="sub" style="margin-bottom:6px">${esc(rel)}
           &middot; ${st.events.length} intents &middot; ${st.edge_series.length} priced points
           &middot; <a href="#" class="ser-close rel">close</a></div>
         ${quoteAndEdgeChart(st.events, st.edge_series)}
         <div class="sub" style="margin-top:6px">Solid = our posted quote (left axis).
           Dashed = post-fee edge per route on its own right axis — different units, so a
           shared axis would flatten both.</div>`;
  return `<tr class="expando" data-k="exp:${esc(rel)}">
    <td colspan="${COLS.length}" style="padding:12px 8px;background:var(--bg)">${body}</td></tr>`;
}

function currentPanel(d){
  if(d.error) return $(`<section class="wide"><h2>Current opportunities</h2>
    <div class="err">${esc(d.error)}</div></section>`);
  const qs = new URLSearchParams(location.search);
  const tab = (k,l) => {
    const q = new URLSearchParams(qs); q.set('scenario', k);
    return `<a href="/current?${q}" class="${d.scenario===k?'on':''}">${l}</a>`;
  };
  const uq = new URLSearchParams(qs);
  if(d.only_tradable) uq.set('all','1'); else uq.delete('all');
  const universe = `<a href="/current?${uq}">${d.only_tradable?'show non-tradable too':'tradable only'}</a>`;
  const clips = [1,5,25,100].map(c=>{
    const q = new URLSearchParams(qs); q.set('clip', c);
    return `<a href="/current?${q}" class="${String(d.clip)===String(c)?'on':''}">${c}</a>`;
  }).join('');

  const rows = (d.rows||[]).map(r=>{
    const p = r.priced, e = Number(p.edge_per_contract);
    const stale = Math.max(r.quote_age_a_s, r.quote_age_b_s);
    // every scenario priced, so the alternatives are visible on the same row
    const alt = SCENARIOS.filter(([k])=>k!==d.scenario && r.scenarios[k])
      .map(([k,l])=>`${l} ${Number(r.scenarios[k].edge_per_contract).toFixed(4)}`).join('   ');
    return `<tr data-k="${esc(r.relationship_id)}">
      <td><a class="rel" href="/pair/${encodeURIComponent(r.relationship_id)}">${esc(r.relationship_id)}</a>
          ${r.intl_leg?'<span class="warn" title="Polymarket international leg: fee priced at the 0.04 default, not this market\'s category">⌁</span>':''}
          ${r.tradable?'':'<span class="dim">(not tradable)</span>'}</td>
      <td class="num">${Number(p.entry_a).toFixed(4)}</td>
      <td class="num">${Number(p.exit_b).toFixed(4)}</td>
      <td class="num dim">${Number(p.gross_cost).toFixed(4)}</td>
      <td class="num dim">${(Number(p.fee_a)+Number(p.fee_b)).toFixed(4)}</td>
      <td class="num">${Number(p.total_cost).toFixed(4)}</td>
      <td class="num ${e>0?(r.actionable?'ok':'warn'):'bad'}">
        <b>${e>0?'+':''}${e.toFixed(4)}</b></td>
      <td class="num ${p.fill_plausible?'dim':'warn'}">${p.maker_spread!=null?Number(p.maker_spread).toFixed(3):'—'}</td>
      <td class="num ${p.take_depth==null||Number(p.take_depth)<Number(d.clip)?'warn':'dim'}">

      <td class="num ${stale>3600?'warn':'dim'}">${dur(stale)}</td>
      <td class="num ${covCls(r,d)}">${covText(r)}</td>
      <td class="dim" style="font-size:11px">${esc(alt)}</td>
    </tr>`;
  }).join('');

  const stales = staleVenues(d);

  return $(`<section class="wide">
    <h2>Current opportunities &middot; ${esc(d.day)}
      &middot; ${d.priced_pairs} priced
      &middot; <span class="dim">${d.profitable} profitable</span>
      &middot; <span class="${d.actionable?'ok':'warn'}">${d.actionable} actionable</span>
      &middot; ${venueChips(d.venues)}
      &middot; <span class="dim">${d.only_tradable?'tradable only':'all pairs'}</span></h2>
    ${d.rollup_current ? '' : `<div class="warn" style="margin-bottom:8px">▲ ${stales.length
      ? stales.join(' and ') + ' stopped covering ' + dur(d.rollup_coverage_age_s)
        + ' ago. Every row with a leg there is priced off a dead book and cannot be '
        + 'actionable until the rollup is rebuilt — the other venues are unaffected.'
      : 'The rollup carries no book for any pair on this board, so nothing here is '
        + 'evidence about now. ' + (unsubscribedVenues(d).length
          ? 'The tape is still being written for ' + unsubscribedVenues(d).join(' and ')

    ${unevalBanner(d, d.only_tradable ? 'permitted pair(s)' : 'pair(s)', d.priced_pairs)}
    <nav style="padding:0;border:0;margin-bottom:6px">${SCENARIOS.map(([k,l])=>tab(k,l)).join('')}</nav>
    <div class="sub" style="margin-bottom:10px">clip size:
      <nav style="display:inline-flex;padding:0;border:0">${clips}</nav>
      &mdash; Kalshi ceils its fee to the cent PER ORDER, so per-contract cost
      genuinely changes with clip. &nbsp;&middot;&nbsp; ${universe}</div>
    <div class="scroll"><table>
      <thead><tr><th>relationship</th><th class="num">entry A</th><th class="num">exit B</th>
        <th class="num">gross</th><th class="num">fees</th><th class="num">total</th>
        <th class="num">edge/ct</th><th class="num">rest spread</th>
        <th class="num" title="Contracts resting at the touch on the leg(s) this route crosses. '?' means the tape carried no size.">take depth</th>
        <th class="num">quote age</th>
        <th class="num" title="How far the ROLLUP covers on the older of this row's two venues — not how long this market has been quiet. Past the limit, the row is history.">coverage</th>
        <th>other scenarios</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Edge = $1.00 &minus; total cost, per contract.
      Buy YES on leg A, buy NO on leg B; the basket pays $1.00 either way.
      Making rests on the near side and pays the maker fee (Kalshi 0.0175 vs 0.07
      taker; PM-US makers pay nothing) but is not a certain fill.
      Quotes are as fresh as the ToB rollup, not as fresh as the venue.<br>
      <b>Actionable</b> = profitable, BOTH of this row's venues still covered by the rollup
      within the last ${(d.max_coverage_age_s/60)|0} minutes, the leg we would rest on inside a spread of
      ${esc(d.max_spread)}, AND at least ${esc(d.clip)} contracts resting at the touch we
      would cross. Making is priced at the FAR touch, the optimistic bound: on a tight
      book that is about right, on a wide one it is fiction — resting an ask at 0.99
      against a 0.40 bid does not fill. Taking is not free either: the price is only
      good for the size behind it, so a clip bigger than the touch walks the book.
      Amber rows are profitable but not plausibly fillable, and they sort below the
      actionable ones.<br>
      ${intlNote(d.rows)}</div>
  </section>`);
}

/* The range was reachable only by hand-editing the URL, and every nav link
   dropped it. Rendered as markup rather than wired handlers so it survives the
   repaints without rebinding. */
function dateRange(base, from, to){
  const back = (n) => {
    const d = new Date((to||new Date().toISOString().slice(0,10)) + 'T00:00:00Z');
    const t = d.toISOString().slice(0,10);
    d.setUTCDate(d.getUTCDate() - (n-1));
    return `${base}?from=${d.toISOString().slice(0,10)}&to=${t}`;
  };
  const span = (from && to)
    ? Math.round((Date.parse(to+'T00:00:00Z') - Date.parse(from+'T00:00:00Z'))/86400000) + 1 : 1;
  const btn = (n,l) => `<a href="${back(n)}" class="${span===n?'on':''}">${l}</a>`;
  return `<div class="sub" style="margin-bottom:10px">range:
    <nav style="display:inline-flex;padding:0;border:0">
      ${btn(1,'today')}${btn(3,'3d')}${btn(7,'7d')}${btn(30,'30d')}</nav>
    &nbsp;<code>?from=YYYY-MM-DD&amp;to=YYYY-MM-DD</code> for anything else</div>`;
}

  const SHOWN = 25;

      <td><a class="rel" href="/pair/${encodeURIComponent(r.relationship_id)}${range}">${esc(r.relationship_id)}</a></td>
      <td class="num">${r.observations.toLocaleString()}</td>
      <td class="num">${r.minutes_seen.toLocaleString()}</td>

    </tr>`).join('');
  return $(`<section class="wide">
    <h2>Opportunity coverage &middot; ${esc(o.from)} → ${esc(o.to)}

      &middot; ${total>SHOWN?`top ${SHOWN} of ${o.relationships}`:`${o.relationships}`} pairs
      &middot; <span class="dim">${o.observations.toLocaleString()} obs in ${o.query_ms} ms</span></h2>
    ${dateRange('/opportunities', o.from, o.to)}

      pair(s) are not shown.</div>`:''}
    <div class="scroll"><table>
      <thead><tr><th>relationship</th><th class="num">observations</th>
        <th class="num">minutes seen</th><th class="num">best edge/ct</th>
        <th class="num">best size</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Read straight off the tape — Parquet for
      closed days, live JSONL for today. Observations are logged ticks, not distinct
      episodes: the scan log only records ticks already past the edge bar, so a
      standing dislocation counts many times.</div>
  </section>`);
}

/* ===========================================================================
   NOW — what the engine is doing, and what is stopping it doing more.

   The one rule this view is built on lives on the server (endpoints/now.rs):
   every REASON is the engine's own, verbatim, and the only arithmetic done to
   it is the subtraction that turns a cap into a break point. Nothing here
   decides whether something should have traded.
   =========================================================================== */
const VERDICT = {
  'acted':             {cls:'ok',   what:'the engine acted on this in the window'},
  'refused':           {cls:'warn', what:'a gate refused it — the gate is named'},
  'no refusal seen':   {cls:'dim',  what:'tradable, in scope, and no gate fired in the window: it either did not clear its APR bar or nothing asked'},
  'not tradable':      {cls:'bad',  what:'never considered — no human vetting stamp and no tradable.yaml entry'},
  'out of engine scope':{cls:'bad', what:'never considered — outside this engine’s --rel-prefix'},
};

/* The minus goes OUTSIDE the dollar sign. "$-4.00" reads as a price for about
   a second before it reads as a deficit, and this column is scanned. */
const usd0 = (v) => (v==null||!isFinite(v)) ? '—'
  : (v<0?'\u2212$':'$') + Math.abs(Number(v)).toLocaleString('en-US',
      {minimumFractionDigits:2, maximumFractionDigits:2});

/* A cap as a bar. Over-cap is drawn PAST the end rather than clamped: a topic
   $4 past its budget and one exactly full are different facts. */
function capBar(used, limit){
  if(used==null || limit==null || !(limit>0)) return '';
  const pct = Math.min(100, (used/limit)*100), over = used > limit;
  return `<div class="bar"><i style="width:${pct.toFixed(1)}%" class="${over?'over':''}"></i></div>`;
}

function nowHead(d){
  const e = d.engine, w = d.window, stale = d.stale_config || [];
  /* The one banner on this page. A cap edited since the engine started is a
     cap this dashboard reads and the engine does not enforce, and every
     number below would otherwise be read as the one refusing orders. */
  const warn = stale.length ? `<div class="banner">
    <b>The engine is not using these files.</b> ${stale.map(c =>
      `<code>${esc(c.path)}</code> changed ${dur(c.changed_ago_s)} ago; the engine
       has been up ${dur(c.engine_up_s)} and reads it only at startup`).join('; ')}.
    Budgets and caps shown below are what is ON DISK — the gates are still
    refusing against the values loaded at launch. A restart is what closes the gap.
  </div>` : '';
  const chip = !e.running ? '<span class="badge bad">NOT RUNNING</span>'
    : e.armed ? '<span class="badge ok">ARMED</span>'

  return $(`<section class="wide">
    <h2>Right now</h2>
    ${warn}

        <div class="sub">cancelled</div></div>
      <div class="stat"><div class="big ${w.resting.length?'ok':'dim'}">${w.resting.length}</div>
        <div class="sub">resting now</div></div>
      <div class="stat"><div class="big ${d.constraints.length?'warn':'ok'}">${d.constraints.length}</div>
        <div class="sub">distinct refusals</div></div>
      <div class="stat" style="flex:1">
        <div>${chip} <b>${esc(e.unit||'no engine')}</b></div>
        <div class="sub">${e.running ? 'up '+dur(e.up_s)+' &middot; pid '+e.pid : 'nothing is trading'}
          ${e.intents?'<br>writing <code>'+esc(e.intents)+'</code>':''}</div>
        <div class="sub">${e.summary_error
          ? '<span class="warn">'+esc(e.summary_error)+'</span>'

    ${e.gauges.length ? `<div class="rowflex" style="margin-top:12px">${e.gauges.map(g =>
      `<div class="stat" data-k="g-${esc(g.key)}" title="${esc(g.what)}">

/* ===========================================================================
   ARCHITECTURE

   The diagram is a pure function of /api/architecture, and the LAYOUT is a
   pure function of each node's (lane, row) — no measurement, no post-render
   effect, no library. That is deliberate: every other attempt at a live
   diagram in a page like this ends up measuring the DOM after paint and
   writing back into it, which is exactly the class of bug the state rule at
   the top of this file exists to prevent.

   Nothing here decides anything. Which components exist, whether each is
   alive, and which edges are carrying traffic all arrive from the server,
   which measures them. This code only draws.
   =========================================================================== */
/* A_TOP is the whole vertical budget above the first row of cards, and it is
   spent deliberately: 0-40 for the order arcs, 44-76 for long-haul edges,
   88 for the lane headings, 96 where the lane bands start. */
const A_LANEW = 196, A_GAP = 54, A_ROWH = 92, A_BOXH = 62, A_TOP = 130, A_PAD = 26;
const archX = (lane) => A_PAD + lane * (A_LANEW + A_GAP);
const archY = (row)  => A_TOP + row * A_ROWH;
const archBox = (n) => ({ x: archX(n.lane), y: archY(n.row), w: A_LANEW, h: A_BOXH,
                          cx: archX(n.lane) + A_LANEW/2, cy: archY(n.row) + A_BOXH/2 });
const archTrunc = (s, n) => String(s).length > n ? String(s).slice(0, n-1) + '…' : String(s);
const archBytes = (b) => b == null ? '' :
  b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : b >= 1e6 ? (b/1e6).toFixed(0)+' MB' :
  b >= 1e3 ? (b/1e3).toFixed(0)+' KB' : b+' B';

/* Edges are routed by where their ends sit, not by hand. Four cases, because
   this graph genuinely has four: forward through the lanes, a hop back one
   lane (a file the engine reads at startup), a loop inside one lane (the
   engine writes the marks file it then decides from), and the order path —
   drawn over the top of everything, because it is the only edge here that
   moves money and it should not be mistaken for another data line.

   Each case returns the four control points of one cubic, not a path string,
   so a label can be put ON the curve rather than near it. */
const A_GUT = A_GAP / 2;          /* the middle of the gap between two lanes */

/* The point at t on a cubic. Three edges arrive at the engine and three leave
   it, and labelled at one shared midpoint they landed on top of each other —
   so each label is placed at a different t along its OWN curve instead. */
const archAt = (p, t) => {
  const u = 1 - t;
  const at = (k) => u*u*u*p[0][k] + 3*u*u*t*p[1][k] + 3*u*t*t*p[2][k] + t*t*t*p[3][k];
  return { x: at('x'), y: at('y') };
};
const archD = (p) =>
  `M${p[0].x} ${p[0].y} C${p[1].x} ${p[1].y}, ${p[2].x} ${p[2].y}, ${p[3].x} ${p[3].y}`;

/* `t` is where along its own curve this edge's label sits; see the caller.
   `w` is the canvas width, which only the last case needs. */
function archRoute(a, b, kind, t, alt, w){
  const A = archBox(a), B = archBox(b), P = (x,y) => ({x, y});
  const cubic = (p) => { const at = archAt(p, t); return { d: archD(p), lx: at.x, ly: at.y - 4 }; };

  // The order path, arcing over everything. It is the only edge here that
  // moves money and it should not read as one more data line.
  //
  // The control points are solved for the apex rather than guessed: a cubic
  // does not pass through its own controls, so a control at y=25 put the
  // actual arc at y≈57, straight through the lane headings.
  if(kind === 'order' && b.lane < a.lane){
    const c = (4/3) * ((16 + (b.row % 3) * 10) - (A.y + B.y)/8);
    return cubic([P(A.cx, A.y), P(A.cx, c), P(B.cx, c), P(B.cx, B.y)]);
  }

  // Two lanes or more apart. A curve drawn straight across would cross the
  // faces of every card in between, so this goes UP the gutter beside the
  // source, across ABOVE the cards, and down the gutter beside the target —
  // through the only space on the canvas guaranteed to be empty.
  if(b.lane - a.lane >= 2){
    const g1 = A.x + A.w + A_GUT, g2 = B.x - A_GUT, r = 16;
    return {
      d: `M${A.x + A.w} ${A.cy} L${g1 - r} ${A.cy} Q${g1} ${A.cy} ${g1} ${A.cy - r}` +
         ` L${g1} ${alt + r} Q${g1} ${alt} ${g1 + r} ${alt}` +
         ` L${g2 - r} ${alt} Q${g2} ${alt} ${g2} ${alt + r}` +
         ` L${g2} ${B.cy - r} Q${g2} ${B.cy} ${g2 + r} ${B.cy} L${B.x} ${B.cy}`,
      lx: (g1 + g2) / 2, ly: alt - 5,
    };
  }
  if(a.lane < b.lane){
    const x1 = A.x + A.w, x2 = B.x, dx = Math.max(30, (x2 - x1) * 0.55);
    return cubic([P(x1, A.cy), P(x1+dx, A.cy), P(x2-dx, B.cy), P(x2, B.cy)]);
  }
  // One lane back: an S that stays INSIDE the gutter. The earlier version
  // dipped below its own endpoints and swept across three cards to do it.
  if(a.lane > b.lane){
    const x1 = A.x, x2 = B.x + B.w;
    return cubic([P(x1, A.cy), P(x1-A_GUT, A.cy), P(x2+A_GUT, B.cy), P(x2, B.cy)]);
  }
  // Same lane: bulge out into a gutter. Down goes right and up goes left, so
  // a write and the read that answers it read as the two sides of a loop —
  // except in the last lane, where bulging right runs off the canvas and the
  // archive edge was drawn half outside the picture.
  const down = b.row > a.row;
  let off = (down ? 1 : -1) * (A.w/2 + 34);
  if(A.cx + off > w - 12 || A.cx + off < 12) off = -off;
  const y1 = down ? A.y + A.h : A.y, y2 = down ? B.y : B.y + B.h;
  return cubic([P(A.cx, y1), P(A.cx+off, y1), P(B.cx+off, y2), P(B.cx, y2)]);
}

/* One line of evidence per node — and it is EVIDENCE, never a restatement of
   the state chip. "up 41m · pid 2466552" and "14s ago · 15 KB" are both facts
   a reader can go and check; "healthy" is not. */
function archChip(n, now){
  if(n.kind === 'timer')
    return n.state === 'live' ? 'next in ' + dur(n.next_s - now) : 'not scheduled';
  // The pid gives way to the tag when there is one: ARMED is the more
  // important fact, and side by side the two ran into each other.
  if(n.up_s != null)
    return 'up ' + dur(n.up_s) +
      (n.pid && !(n.tags||[]).length ? ' · pid ' + n.pid : '');
  if(n.age_s == null) return n.state === 'off' ? 'not writing' : 'missing';
  return dur(n.age_s) + ' ago' + (n.bytes != null ? ' · ' + archBytes(n.bytes) : '');
}

function archNode(n, now){
  const B = archBox(n);
  const tag = (n.tags && n.tags.length) ? n.tags[0] : '';
  const dot = 'd-' + n.state + (n.state === 'live' ? ' pulse' : '');
  return `<g class="an k-${n.kind} st-${n.state}" data-k="n-${esc(n.id)}">
    <title>${esc(n.label)} — ${esc(n.what)}</title>
    <rect class="nbox" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="7"/>
    <rect class="nbar b-${n.state}" x="${B.x}" y="${B.y}" width="3" height="${B.h}"/>
    <circle class="ndot ${dot}" cx="${B.x+B.w-11}" cy="${B.y+15}" r="3.5"/>
    <text class="nlabel" x="${B.x+12}" y="${B.y+19}">${esc(archTrunc(n.label,21))}</text>
    <text class="nsub" x="${B.x+12}" y="${B.y+34}">${esc(archTrunc(n.sub,28))}</text>
    <text class="nchip c-${n.state}" x="${B.x+12}" y="${B.y+51}">${esc(archChip(n,now))}</text>
    ${tag ? `<text class="ntag" x="${B.x+B.w-11}" y="${B.y+51}"
      text-anchor="end">${esc(tag)}</text>` : ''}
  </g>`;
}

function archSvg(d){
  const N = {};
  d.nodes.forEach(n => { N[n.id] = n; });
  const rows  = Math.max(...d.nodes.map(n => n.row)) + 1;
  const lanes = d.lanes.length;
  const W = A_PAD*2 + lanes*A_LANEW + (lanes-1)*A_GAP;
  const H = archY(rows-1) + A_BOXH + 26;
  const now = d.generated_at;

  const marker = (kind) =>
    `<marker id="ah-${kind}" markerWidth="7" markerHeight="7" refX="6.5" refY="3"
       orient="auto" markerUnits="userSpaceOnUse">
       <path class="m-${kind}" d="M0,0 L7,3 L0,6 z"/></marker>`;

  const bands = d.lanes.map((l,i) => `
    <rect class="laneband" x="${archX(i)-10}" y="${A_TOP-34}"
      width="${A_LANEW+20}" height="${rows*A_ROWH+8}" rx="10"/>
    <text class="lane" x="${archX(i)}" y="${A_TOP-42}">${esc(l)}</text>`).join('');

  /* Labels are spread along their own curves exactly where they would
     otherwise converge: five edges arrive at the dashboard and three leave
     the socket, and every one of those labels wants the same few pixels.
     Spread by the TARGET where edges fan in, by the source where they fan
     out, and leave a lone edge at its midpoint. Deterministic, so the picture
     does not reshuffle on every repaint. */
  const into = {}, from = {}, seenTo = {}, seenFrom = {}, alt = {};
  d.edges.forEach(e => {
    into[e.to]   = (into[e.to]   || 0) + 1;
    from[e.from] = (from[e.from] || 0) + 1;
  });
  const edges = d.edges.map(e => {
    const a = N[e.from], b = N[e.to];
    if(!a || !b) return '';
    const ti = seenTo[e.to]     = (seenTo[e.to]     || 0), fi = seenFrom[e.from] = (seenFrom[e.from] || 0);
    seenTo[e.to] = ti + 1; seenFrom[e.from] = fi + 1;
    const t = into[e.to] > 1      ? 0.22 + ti * (0.56 / (into[e.to] - 1))
            : from[e.from] > 1    ? 0.30 + fi * (0.48 / (from[e.from] - 1))
            : 0.5;
    // Long-haul edges each get their own altitude so two of them never share
    // a line. Only they consume one — the counter is what spaces them.
    const key = e.from + '>' + e.to;
    if(b.lane - a.lane >= 2 && alt[key] === undefined)
      alt[key] = 52 + Object.keys(alt).length * 14;
    const cls  = e.live ? e.kind : 'dead';
    const flow = e.live && (e.kind === 'feed' || e.kind === 'order') ? ' flow' : '';
    const r = archRoute(a, b, e.kind, t, alt[key], W);
    return `<g data-k="e-${esc(e.from)}-${esc(e.to)}">
      <path class="e ${cls}${flow}" d="${r.d}" marker-end="url(#ah-${cls})"/>
      <text class="elabel" x="${r.lx.toFixed(1)}" y="${r.ly.toFixed(1)}"
        text-anchor="middle">${esc(e.label)}</text>
    </g>`;
  }).join('');

  return `<svg class="arch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="arbbot component architecture">
    <defs>${['feed','write','read','order','dead'].map(marker).join('')}</defs>
    ${bands}${edges}
    ${d.nodes.map(n => archNode(n, now)).join('')}
  </svg>`;
}
