<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>arbbot capital</title>
<style>
  :root{
    --bg:#0b0e12; --panel:#12171e; --raised:#171d26; --line:#252d38;
    --line-strong:#344050; --ink:#edf1f7; --dim:#8f9baa; --muted:#626e7d;
    --ok:#50d890; --bad:#ff6b6b; --warn:#f2b84b; --accent:#6aaeff;
    --kalshi:#4dd5c5; --pmus:#a78bfa; --shadow:0 14px 36px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f8; --panel:#fff; --raised:#f8fafc; --line:#e1e6ec;
      --line-strong:#cbd3dd; --ink:#151a21; --dim:#596575; --muted:#7e8996;
      --ok:#168752; --bad:#cf3b3b; --warn:#9a6700; --accent:#0969da;
      --kalshi:#087f75; --pmus:#7253c7; --shadow:0 12px 30px rgba(23,35,50,.08); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:22px 28px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.08em;text-transform:uppercase}
  .sub{color:var(--dim);font-size:12px}
  main{padding:16px 28px 56px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));max-width:1600px;margin:0 auto}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
  section.wide{grid-column:1/-1}
  h2{font-size:11px;margin:0 0 14px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;
     text-transform:uppercase;letter-spacing:.06em;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .num,.big,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
    border:1px solid currentColor}
  .big{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv b{font-weight:600;font-variant-numeric:tabular-nums}
  .rule{border-top:1px solid var(--line);margin:8px 0}
  .scroll{overflow-x:auto}
  .err{color:var(--bad);padding:12px}
  code{color:var(--accent)}
  a.rel{color:var(--accent);text-decoration:none}
  button{font:inherit;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
  button:disabled{color:var(--dim);border-color:var(--line);cursor:default}
  a.rel:hover{text-decoration:underline}
  nav{display:flex;gap:2px;padding:0 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav a{color:var(--dim);text-decoration:none;padding:8px 14px;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid transparent}
  nav a:hover{color:var(--ink)}
  nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}

  /* --- capital / paired holdings ---------------------------------------- */
  .capital-hero{padding:22px 24px;background:
    radial-gradient(circle at 100% 0,rgba(106,174,255,.10),transparent 35%),var(--panel)}
  .hero-line{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .eyebrow{color:var(--dim);font-size:11px;letter-spacing:.11em;text-transform:uppercase}
  .hero-value{font:600 36px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em;margin-top:4px}
  .metric-grid{display:grid;grid-template-columns:repeat(3,minmax(125px,1fr));gap:10px;min-width:min(100%,520px)}
  .metric-card{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .metric-card span{display:block;color:var(--dim);font-size:11px;margin-bottom:3px}
  .metric-card b{font:600 17px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace}
  .venue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .venue-summary{position:relative;overflow:hidden;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:16px}
  .venue-summary:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--venue)}
  .venue-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .venue-name{font-weight:650;letter-spacing:.01em}.venue-name small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:1px}
  .venue-dot{width:8px;height:8px;border-radius:50%;background:var(--venue);box-shadow:0 0 12px var(--venue)}
  .venue-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .venue-metrics span,.mini-label{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
  .venue-metrics b{display:block;margin-top:3px;font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace}
  .pair-board{padding:0;overflow:hidden}
  .pair-board-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:19px 22px;border-bottom:1px solid var(--line)}
  .pair-board-head h2{margin:0 0 5px}.pair-summary{display:flex;gap:18px;flex-wrap:wrap;text-align:right}
  .pair-summary b{display:block;font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace}.pair-summary span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
  .pair-columns,.pair-row{display:grid;grid-template-columns:minmax(230px,1fr) minmax(190px,.64fr) minmax(230px,1fr);gap:14px}
  .pair-columns{padding:9px 22px;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.09em;background:var(--raised)}
  .pair-columns span:nth-child(2){text-align:center}.pair-columns span:last-child{text-align:right}
  .pair-wrap{padding:18px 22px;border-top:1px solid var(--line)}.pair-wrap:first-of-type{border-top:0}
  .pair-title{display:flex;align-items:center;gap:9px;margin-bottom:10px;min-width:0}
  .pair-title strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pair-id{color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}.status-dot.warn{background:var(--warn)}.status-dot.bad{background:var(--bad)}
  .leg-card{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-width:0}
  .leg-card.kalshi{border-left:3px solid var(--kalshi)}.leg-card.pmus{border-right:3px solid var(--pmus);text-align:right}
  .leg-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.leg-card.pmus .leg-top{flex-direction:row-reverse}
  .position-chip{font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace}.position-chip .yes{color:var(--ok)}.position-chip .no{color:var(--warn)}
  .leg-value{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;margin:5px 0 2px}
  .market-id{color:var(--dim);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pair-core{text-align:center;display:flex;flex-direction:column;justify-content:center;padding:3px 6px}
  .juice{font:650 22px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.03em}
  .juice-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:3px 0 8px}
  .pair-facts{display:flex;justify-content:center;gap:12px;color:var(--dim);font-size:11px}.pair-facts b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .orphan-table{margin-top:16px}.design-note{max-width:900px;margin-top:8px;color:var(--dim);font-size:11px}
  @media (max-width:760px){
    header,nav{padding-left:16px;padding-right:16px}main{padding:12px 16px 40px}
    .metric-grid,.venue-grid{grid-template-columns:1fr}.hero-line{align-items:stretch}
    .pair-columns{display:none}.pair-row{grid-template-columns:1fr}.pair-core{order:-1;padding:4px 0 8px}
    .leg-card.pmus{text-align:left;border-right:1px solid var(--line);border-left:3px solid var(--pmus)}
    .leg-card.pmus .leg-top{flex-direction:row}.pair-summary{text-align:left}.pair-board-head{display:block}
  }

  /* --- trades / ledger -------------------------------------------------- */
  .trades-hero{padding:24px;background:
    radial-gradient(circle at 100% 0,rgba(80,216,144,.10),transparent 38%),var(--panel)}
  .trades-hero .hero-value{font-size:38px}
  .trade-headline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px}
  .trade-headline .badge{font-family:ui-sans-serif,system-ui,sans-serif}
  .trade-explorer{padding:0;overflow:hidden}
  .trade-explorer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 15px}
  .trade-explorer-head h2{margin-bottom:5px}
  .trade-count{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
  .trade-tabs{display:flex;gap:5px;padding:0 22px 14px;overflow-x:auto}
  .trade-tab{border-color:var(--line);color:var(--dim);background:transparent;border-radius:99px;padding:6px 12px;white-space:nowrap}
  .trade-tab:hover{color:var(--ink);border-color:var(--line-strong)}
  .trade-tab.on{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .trade-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(130px,auto));gap:9px;padding:12px 22px;background:var(--raised);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .trade-control{width:100%;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:12px/1.3 inherit;outline:none}
  .trade-control:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  .trade-table{min-width:1030px}
  .trade-table th{padding:10px 10px}.trade-table td{padding:10px;vertical-align:top}
  .trade-table tbody tr:hover{background:color-mix(in srgb,var(--raised) 64%,transparent)}
  .trade-primary{font-weight:600;max-width:350px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trade-when{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);margin-top:3px}
  .trade-legs{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .leg-pill{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:2px 5px}
  .leg-pill.kalshi{border-left:2px solid var(--kalshi)}.leg-pill.polymarket_us{border-left:2px solid var(--pmus)}
  .trade-state{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .trade-state:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .trade-state.open{color:var(--ok)}.trade-state.realized{color:var(--accent)}.trade-state.retired{color:var(--dim)}
  .trade-money{font-weight:650;font-size:14px}.trade-money .sub{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:400;margin-top:2px}
  .trade-pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 22px;border-top:1px solid var(--line);background:var(--raised)}
  .trade-pagination button{border-color:var(--line-strong);color:var(--ink);background:var(--panel)}
  .trade-pagination button:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
  .trade-page-buttons{display:flex;align-items:center;gap:8px}
  .trade-method{padding:14px 22px;border-top:1px solid var(--line)}
  details.audit-note summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none}
  details.audit-note summary::-webkit-details-marker{display:none}
  details.audit-note summary:before{content:"+";display:inline-block;width:18px;color:var(--accent)}
  details.audit-note[open] summary:before{content:"−"}
  details.audit-note .sub{margin:10px 0 0 18px;max-width:1050px;line-height:1.65}
  .analysis-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;grid-column:1/-1}
  .analysis-grid section{min-width:0}
  @media (max-width:900px){
    .trade-toolbar{grid-template-columns:1fr 1fr}.trade-search{grid-column:1/-1}
    .analysis-grid{grid-template-columns:1fr}
  }
  @media (max-width:600px){
    .trades-hero .hero-value{font-size:31px}.trade-toolbar{grid-template-columns:1fr}.trade-search{grid-column:auto}
    .trades-hero .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .trades-hero .metric-card{padding:10px}
    .trade-explorer-head{display:block}.trade-count{margin-top:8px}.trade-pagination{align-items:flex-start;flex-direction:column}
  }
  @media (max-width:350px){.trades-hero .metric-grid{grid-template-columns:1fr}}

  /* --- now view --------------------------------------------------------- */
  .rowflex{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .banner{border:1px solid var(--warn);color:var(--warn);border-radius:6px;
    padding:9px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
  .banner code{color:inherit}
  .stat{min-width:96px}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .bar i.over{background:var(--bad)}
  .split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:4px 0 8px}
  .split i{display:block;height:100%}
  .split i.v-ok{background:var(--ok)} .split i.v-warn{background:var(--warn)}
  .split i.v-bad{background:var(--bad)} .split i.v-dim{background:var(--dim)}

  /* --- architecture diagram -------------------------------------------- */
  .arch{width:100%;height:auto;display:block;overflow:visible}
  .arch text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .arch .laneband{fill:var(--line);opacity:.16}
  .arch .lane{fill:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .arch .nbox{fill:var(--panel);stroke:var(--line);stroke-width:1}
  .arch .k-artifact .nbox{stroke-dasharray:4 3}
  .arch .k-part .nbox{stroke-dasharray:1 3}
  .arch .k-venue .nbox{fill:var(--bg)}
  .arch .st-down .nbox{stroke:var(--bad)}
  .arch .st-stale .nbox,.arch .st-alive .nbox{stroke:var(--warn)}
  .arch .nlabel{fill:var(--ink);font-size:12px;font-weight:600}
  .arch .nsub{fill:var(--dim);font-size:10px}
  .arch .nchip{font-size:10.5px;fill:var(--dim)}
  .arch .ntag{font-size:10px;font-weight:700;letter-spacing:.06em;fill:var(--warn)}
  .arch .c-down{fill:var(--bad)} .arch .c-stale,.arch .c-alive{fill:var(--warn)}
  .arch .b-live{fill:var(--ok)} .arch .b-stale,.arch .b-alive{fill:var(--warn)}
  .arch .b-down{fill:var(--bad)} .arch .b-off{fill:var(--dim)}
  .arch .d-live{fill:var(--ok)} .arch .d-stale,.arch .d-alive{fill:var(--warn)}
  .arch .d-down{fill:var(--bad)} .arch .d-off{fill:var(--dim)}
  .arch .e{fill:none;stroke-width:1.4}
  .arch .e.feed{stroke:var(--accent)}
  .arch .e.write{stroke:var(--ok)}
  .arch .e.read{stroke:var(--dim);stroke-dasharray:5 4}
  .arch .e.order{stroke:var(--warn);stroke-width:2.2}
  .arch .e.dead{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
  /* Arrowheads are styled through a CLASS, never a fill="var(--x)" attribute:
     a presentation attribute is not a CSS declaration and browsers do not
     resolve a custom property inside one. Every head rendered black. */
  .arch .m-feed{fill:var(--accent)} .arch .m-write{fill:var(--ok)}
  .arch .m-read{fill:var(--dim)}    .arch .m-order{fill:var(--warn)}
  .arch .m-dead{fill:var(--line)}
  /* The halo is what keeps a label readable where it sits on top of a line. */
  .arch .elabel{fill:var(--dim);font-size:9.5px;paint-order:stroke;
    stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
  .arch .flow{stroke-dasharray:6 8;animation:archflow 1.2s linear infinite}
  .arch .pulse{animation:archpulse 2.4s ease-in-out infinite}
  @keyframes archflow{to{stroke-dashoffset:-28}}
  @keyframes archpulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){
    .arch .flow,.arch .pulse{animation:none}
    .arch .flow{stroke-dasharray:none}
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:0;border-top-width:2px;
    border-top-style:solid;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>arbbot capital</h1>
  <span class="sub" id="meta">loading…</span>
  <span class="sub" id="link" style="margin-left:auto">● connecting…</span>
</header>
<nav id="nav"></nav>
<main id="root"></main>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };

/* ---------------------------------------------------------------------------
   In-place DOM patching.

   Panels are still built as strings — that code is fine and readable. What
   changed is how the result is APPLIED: the new tree is diffed against the
   live one and only the differences are written. Nodes are never destroyed,
   so scroll position, focus, caret, text selection and :hover survive a
   repaint for free. The previous build replaced everything and then tried to
   put the scroll back by hand, which is exactly the jump you could see.

   Rows carry `data-k`; matching on it means a re-sort MOVES existing rows
   instead of rewriting every cell in the table.

   ~60 lines, no build step, no dependency — the alternative was a bundler and
   node_modules inside a Rust binary that ships its UI via include_str!.
   --------------------------------------------------------------------------- */
function morph(from, to){
  if(from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){
    from.replaceWith(to);
    return;
  }
  if(from.nodeType === Node.TEXT_NODE || from.nodeType === Node.COMMENT_NODE){
    if(from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue;
    return;
  }
  if(from.nodeType !== Node.ELEMENT_NODE) return;

  for(const a of Array.from(to.attributes))
    if(from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  for(const a of Array.from(from.attributes))
    if(!to.hasAttribute(a.name)) from.removeAttribute(a.name);

  // Never fight the user for a field they are typing in.
  if(from === document.activeElement && 'value' in from) return;
  if('value' in from && from.value !== to.value) from.value = to.value;

  morphChildren(from, to);
}

function morphChildren(from, to){
  const keyed = new Map();
  for(const c of Array.from(from.children))
    if(c.dataset && c.dataset.k != null) keyed.set(c.dataset.k, c);

  let cursor = from.firstChild;
  for(const n of Array.from(to.childNodes)){
    const k = (n.nodeType === Node.ELEMENT_NODE && n.dataset) ? n.dataset.k : null;
    let target = null;
    if(k != null && keyed.has(k)){
      target = keyed.get(k);
      keyed.delete(k);
    } else if(cursor && cursor.nodeName === n.nodeName &&
              !(cursor.nodeType === Node.ELEMENT_NODE && cursor.dataset &&
                cursor.dataset.k != null)){
      target = cursor;
    }
    if(target){
      if(target === cursor) cursor = cursor.nextSibling;
      else from.insertBefore(target, cursor);   // a keyed row that moved
      morph(target, n);
    } else {
      from.insertBefore(n, cursor);
    }
  }
  // Anything the new tree did not claim is at or after the cursor.
  while(cursor){ const next = cursor.nextSibling; from.removeChild(cursor); cursor = next; }
}

/* Apply a freshly built fragment to a live container. */
function apply(container, frag){
  const shell = document.createElement(container.nodeName);
  shell.append(frag);
  morphChildren(container, shell);
}
const money = (s) => {
  const n = Number(s);
  if (!isFinite(n)) return s;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const sign = (s) => Number(s) < 0 ? 'bad' : 'ok';
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* A dollar cell that refuses to invent a number. money(null) renders "0.00",
   and a 0.00 in a column of dollars reads as "nothing happened" rather than "we
   could not establish this" — that ambiguity is how 35 unpriceable ledger
   records were reported as $56 of profit (2026-07-28 audit). A value the server
   sent as null MUST look absent, and must carry the server's reason. */
const usd = (v, why) => (v===null||v===undefined||!isFinite(Number(v)))
  ? `<span class="warn" title="${esc(why||'not computable from the ledger')}">unknown</span>`
  : '$'+money(v);
const usdSign = (v) => (v===null||v===undefined||!isFinite(Number(v))) ? '' : sign(v);

function statement(st, accounts){
  const net = Number(st.net_vs_capital);
  // The realized line is a NET of several accounts, and one of them is an
  // unitemized plug an order of magnitude bigger than the total. Showing only
  // the net let a +$7 headline stand on a −$49 residual nobody had explained.
  const parts = (accounts||[]).filter(a=>a.account.startsWith('pnl:realized'));
  const breakdown = parts.length > 1 ? `<div class="sub" style="margin:2px 0 8px 12px">` +
    parts.map(a=>`<div class="kv" style="border:0;padding:2px 0">
      <span>${esc(a.account.replace('pnl:realized:',''))}</span>
      <b class="${sign(a.balance)}">$${money(a.balance)}</b></div>`).join('') +
    `<div style="margin-top:4px">an <b>unitemized</b> component is a residual, not a
      trade — the realized figure is only as good as that plug is small.</div></div>` : '';
  return $(`<section>
    <h2>Statement of position &middot; cost basis</h2>
    <div class="big ${net<0?'bad':'ok'}">${net<0?'−':'+'}$${money(Math.abs(net))}</div>
    <div class="sub" style="margin-bottom:10px">net versus capital in</div>
    <div class="kv"><span>capital in</span><b>$${money(st.capital_in)}</b></div>
    <div class="kv"><span>cash</span><b>$${money(st.cash)}</b></div>
    <div class="kv"><span>positions at cost</span><b>$${money(st.positions_at_cost)}</b></div>
    <div class="kv"><span>total assets</span><b>$${money(st.total_assets)}</b></div>
    <div class="rule"></div>
    <div class="kv"><span>trading (realized)</span>
      <b class="${sign(st.trading_realized)}">$${money(st.trading_realized)}</b></div>
    ${breakdown}
    <div class="kv"><span>fees</span><b class="bad">−$${money(st.fees)}</b></div>
    <div class="sub" style="margin-top:8px">
      <b>Not comparable to the Trades tab.</b> This is cost basis over venue
      snapshots; Trades is derived from the append-only ledger, includes
      unrealized profit on open baskets, and charges a different fee population.
      The PM-US half of realized is dominated by the <b>unitemized plug</b>, which
      is a single residual — it cannot tell one record's P&amp;L from another's, so
      a close match between the two figures is not evidence either is right.

}

/* "vs venue truth" was a promise the page could not keep: the Kalshi side is a
   number passed on the command line, so it cannot drift and the row read EXACT
   forever. Every input now carries where it came from and how old it is. */
/* A row that cannot fail is not a check and must not be painted like one. Both
   rows here read a green EXACT for every possible input: cash:pmus is forced
   equal to buyingPower by the import's plug entry, and cash:kalshi is compared
   against a number typed on the command line (2026-07-28 audit). They are kept
   because the figures are worth seeing, but they now say NOT A CHECK, and the
   server computes rows beside them that genuinely can fail. */
function reconPanel(b){
  const rs = b.reconciliations, sources = b.sources;
  if(!rs || !rs.length) return $(`<section><h2>Reconciliation</h2>
    <div class="dim">no venue balances supplied</div></section>`);
  const verdict = (r) => r.falsifiable === false
    ? `<span class="warn" title="${esc(r.why||'')}">NOT A CHECK</span>`
    : (r.exact ? '<span class="ok">EXACT</span>'
               : `<span class="bad">${money(r.diff)}</span>`);
  const rows = rs.map(r=>`<tr>
      <td>${esc(r.account)}<div class="sub">${esc(r.why||'')}</div></td>
      <td class="num">$${money(r.books)}</td>
      <td class="num">$${money(r.venue)}</td>
      <td class="num">${verdict(r)}</td>
    </tr>`).join('');
  const src = (sources||[]).map(s=>`<tr>
      <td>${esc(s.what)}</td>
      <td class="dim" style="font-size:11px">${esc(String(s.from).replace(/^.*\//,''))}</td>
      <td class="num ${s.frozen||s.stale?'warn':'dim'}">${dur(s.age_s)}${s.frozen?' fixed':(s.stale?' stale':'')}</td>
    </tr>`).join('');
  const anyFrozen = (sources||[]).some(s=>s.frozen);
  const nCheck = Number(b.checks_falsifiable||0), nFail = Number(b.checks_failed||0);
  return $(`<section>
    <h2>Reconciliation vs the last venue snapshot</h2>
    <div class="${nFail?'bad':(nCheck?'ok':'warn')}" style="margin-bottom:6px">
      ${nCheck ? `${nCheck} falsifiable check(s) &middot; <b>${nFail} failing</b>`
               : 'no falsifiable check on this page'}
    </div>
    <table><thead><tr><th>claim</th><th class="num">books</th>
      <th class="num">snapshot</th><th class="num">verdict</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="rule"></div>
    <h2>Where those numbers came from</h2>
    <table><thead><tr><th>input</th><th>source</th><th class="num">age</th></tr></thead>
      <tbody>${src}</tbody></table>
    ${b.snapshot_stale ? `<div class="bad" style="margin-top:8px">▲ The venue snapshot is
      <b>${dur(b.snapshot_age_s)}</b> old. Every verdict above is a statement about that
      snapshot, not about the account now — FROZEN, not passing.</div>` : ''}
    ${anyFrozen ? `<div class="warn" style="margin-top:8px">▲ Rows marked <b>fixed</b> were
      set on the command line when this process started. They cannot move, so matching
      them is not evidence the venue agrees — re-pull the snapshot and restart to
      actually check.</div>` : ''}
  </section>`);
}

/* Human-readable duration shared by every live view. */
function dur(sec){
  if(sec==null||sec<0) return '—';
  const s=Math.round(sec);
  if(s<60) return s+'s';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return r?`${m}m ${r}s`:`${m}m`;
  const h=Math.floor(m/60), rm=m%60;
  if(h<24) return rm?`${h}h ${rm}m`:`${h}h`;
  const d=Math.floor(h/24); return `${d}d ${h%24}h`;
}

    </tr>`).join('');
  const el = $(`<section class="wide">
    <h2>Tracked pairs &middot; ${d.count} registered &middot; ${d.tradable} tradable
      <span class="dim">(${d.human_vetted} by human verdict, ${d.allowlisted}

}


/* The range was reachable only by hand-editing the URL, and every nav link
   dropped it. Rendered as markup rather than wired handlers so it survives the
   repaints without rebinding. */
function dateRange(base, from, to){
  const back = (n) => {
    const d = new Date((to||new Date().toISOString().slice(0,10)) + 'T00:00:00Z');
    const t = d.toISOString().slice(0,10);
    d.setUTCDate(d.getUTCDate() - (n-1));
    return `${base}?from=${d.toISOString().slice(0,10)}&to=${t}`;
  };
  const span = (from && to)
    ? Math.round((Date.parse(to+'T00:00:00Z') - Date.parse(from+'T00:00:00Z'))/86400000) + 1 : 1;
  const btn = (n,l) => `<a href="${back(n)}" class="${span===n?'on':''}">${l}</a>`;
  return `<div class="sub" style="margin-bottom:10px">range:
    <nav style="display:inline-flex;padding:0;border:0">
      ${btn(1,'today')}${btn(3,'3d')}${btn(7,'7d')}${btn(30,'30d')}</nav>
    &nbsp;<code>?from=YYYY-MM-DD&amp;to=YYYY-MM-DD</code> for anything else</div>`;
}

/* ===========================================================================
   NOW — what the engine is doing, and what is stopping it doing more.

   The one rule this view is built on lives on the server (endpoints/now.rs):
   every REASON is the engine's own, verbatim, and the only arithmetic done to
   it is the subtraction that turns a cap into a break point. Nothing here
   decides whether something should have traded.
   =========================================================================== */
const VERDICT = {
  'acted':             {cls:'ok',   what:'the engine acted on this in the window'},
  'refused':           {cls:'warn', what:'a gate refused it — the gate is named'},
  'no refusal seen':   {cls:'dim',  what:'tradable, in scope, and no gate fired in the window: it either did not clear its APR bar or nothing asked'},
  'not tradable':      {cls:'bad',  what:'never considered — no human vetting stamp and no tradable.yaml entry'},
  'out of engine scope':{cls:'bad', what:'never considered — outside this engine’s --rel-prefix'},
};

/* The minus goes OUTSIDE the dollar sign. "$-4.00" reads as a price for about
   a second before it reads as a deficit, and this column is scanned. */
const usd0 = (v) => (v==null||!isFinite(v)) ? '—'
  : (v<0?'\u2212$':'$') + Math.abs(Number(v)).toLocaleString('en-US',
      {minimumFractionDigits:2, maximumFractionDigits:2});

/* A cap as a bar. Over-cap is drawn PAST the end rather than clamped: a topic
   $4 past its budget and one exactly full are different facts. */
function capBar(used, limit){
  if(used==null || limit==null || !(limit>0)) return '';
  const pct = Math.min(100, (used/limit)*100), over = used > limit;
  return `<div class="bar"><i style="width:${pct.toFixed(1)}%" class="${over?'over':''}"></i></div>`;
}

function nowHead(d){
  const e = d.engine, w = d.window, stale = d.stale_config || [];
  /* The one banner on this page. A cap edited since the engine started is a

  const warn = stale.length ? `<div class="banner">
    <b>The engine is not using these files.</b> ${stale.map(c =>
      `<code>${esc(c.path)}</code> changed ${dur(c.changed_ago_s)} ago; the engine
       has been up ${dur(c.engine_up_s)} and reads it only at startup`).join('; ')}.
    Budgets and caps shown below are what is ON DISK — the gates are still
    refusing against the values loaded at launch. A restart is what closes the gap.
  </div>` : '';
  const chip = !e.running ? '<span class="badge bad">NOT RUNNING</span>'
    : e.armed ? '<span class="badge ok">ARMED</span>'
              : '<span class="badge warn">DRY-RUN</span>';
  return $(`<section class="wide">
    <h2>Right now</h2>
    ${warn}
    <div class="rowflex">
      <div class="stat"><div class="big ${w.places?'ok':'dim'}">${w.places}</div>

        <div>${chip} <b>${esc(e.unit||'no engine')}</b></div>
        <div class="sub">${e.running ? 'up '+dur(e.up_s)+' &middot; pid '+e.pid : 'nothing is trading'}
          ${e.intents?'<br>writing <code>'+esc(e.intents)+'</code>':''}</div>
        <div class="sub">${e.summary_error
          ? '<span class="warn">'+esc(e.summary_error)+'</span>'

    ${e.gauges.length ? `<div class="rowflex" style="margin-top:12px">${e.gauges.map(g =>
      `<div class="stat" data-k="g-${esc(g.key)}" title="${esc(g.what)}">

        <div class="sub">${esc(g.key.replace(/_/g,' '))}</div></div>`).join('')}</div>` : ''}
    <div class="sub" style="margin-top:10px">
      Counts are over the last ${dur(w.seconds)} of the engine's own decision

/* THE panel. Everything else on this page is context for it. */
function nowConstraints(d){
  if(!d.constraints.length) return $(`<section class="wide">
    <h2>What is stopping us</h2>
    <div class="kv"><span>refusals in the window</span><b class="ok">none</b></div>
    <div class="sub" style="margin-top:8px">Nothing the engine looked at was
      refused by a gate. If it is also not placing, the reason is upstream of
      risk: no crossing cleared its APR bar, or no book moved.</div>
  </section>`);
  return $(`<section class="wide">
    <h2>What is stopping us &middot; ${dur(d.window.seconds)}</h2>
    <div class="scroll"><table>
      <thead><tr><th>gate</th><th>applies to</th><th class="num">times</th>
        <th class="num">deployed</th><th class="num">limit</th>
        <th style="width:130px">headroom</th><th class="num">to unblock</th>
        <th>the engine's words</th></tr></thead>
      <tbody>${d.constraints.map(c => `<tr data-k="c-${esc(c.gate+(c.scope||''))}">
        <td><b>${esc(c.gate)}</b></td>
        <td>${c.scoped ? esc(c.scope)
          : '<span class="dim" title="This gate names no scope: it refuses every pair it covers, so no row on it is about one pair.">everything</span>'}</td>
        <td class="num">${c.hits.toLocaleString()}</td>
        <td class="num">${c.deployed==null?'<span class="dim">—</span>':usd0(c.deployed)}</td>
        <td class="num">${c.limit==null?'<span class="dim">—</span>'
          : (c.gate==='low-utilisation gate' ? 'util &lt; '+c.limit : usd0(c.limit))}</td>
        <td>${c.gate==='low-utilisation gate'
            ? capBar(c.at, c.limit)+`<div class="sub">at ${c.at}</div>`
            : capBar(c.deployed, c.limit) +
              (c.headroom==null?'':`<div class="sub ${c.headroom<0?'bad':''}">${
                c.headroom<0 ? usd0(-c.headroom)+' over' : usd0(c.headroom)+' left'}</div>`)}</td>
        <td class="num">${c.free_needed==null
          ? '<span class="dim">fits</span>'
          : '<b class="warn">free '+usd0(c.free_needed)+'</b>'}</td>
        <td class="sub"><code>${esc(c.text)}</code>
          <div>last ${dur(c.last_age_s)} ago</div></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <details class="audit-note" style="margin-top:10px"><summary>How to read the strategy table</summary><div class="sub">
      Every number in this table except <b>headroom</b> and <b>to unblock</b> was
      printed by the engine as it refused an order; those two are
      <code>limit &minus; deployed</code> and <code>need &minus; headroom</code>.
      Nothing here re-runs the risk gate — a second copy of it would eventually

/* ===========================================================================
   ARCHITECTURE

   The diagram is a pure function of /api/architecture, and the LAYOUT is a
   pure function of each node's (lane, row) — no measurement, no post-render
   effect, no library. That is deliberate: every other attempt at a live
   diagram in a page like this ends up measuring the DOM after paint and
   writing back into it, which is exactly the class of bug the state rule at
   the top of this file exists to prevent.

   Nothing here decides anything. Which components exist, whether each is
   alive, and which edges are carrying traffic all arrive from the server,
   which measures them. This code only draws.
   =========================================================================== */
/* A_TOP is the whole vertical budget above the first row of cards, and it is
   spent deliberately: 0-40 for the order arcs, 44-76 for long-haul edges,
   88 for the lane headings, 96 where the lane bands start. */
const A_LANEW = 196, A_GAP = 54, A_ROWH = 92, A_BOXH = 62, A_TOP = 130, A_PAD = 26;
const archX = (lane) => A_PAD + lane * (A_LANEW + A_GAP);
const archY = (row)  => A_TOP + row * A_ROWH;
const archBox = (n) => ({ x: archX(n.lane), y: archY(n.row), w: A_LANEW, h: A_BOXH,
                          cx: archX(n.lane) + A_LANEW/2, cy: archY(n.row) + A_BOXH/2 });
const archTrunc = (s, n) => String(s).length > n ? String(s).slice(0, n-1) + '…' : String(s);
const archBytes = (b) => b == null ? '' :
  b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : b >= 1e6 ? (b/1e6).toFixed(0)+' MB' :
  b >= 1e3 ? (b/1e3).toFixed(0)+' KB' : b+' B';

/* Edges are routed by where their ends sit, not by hand. Four cases, because
   this graph genuinely has four: forward through the lanes, a hop back one
   lane (a file the engine reads at startup), a loop inside one lane (the
   engine writes the marks file it then decides from), and the order path —
   drawn over the top of everything, because it is the only edge here that
   moves money and it should not be mistaken for another data line.

   Each case returns the four control points of one cubic, not a path string,
   so a label can be put ON the curve rather than near it. */
const A_GUT = A_GAP / 2;          /* the middle of the gap between two lanes */

/* The point at t on a cubic. Three edges arrive at the engine and three leave
   it, and labelled at one shared midpoint they landed on top of each other —
   so each label is placed at a different t along its OWN curve instead. */
const archAt = (p, t) => {
  const u = 1 - t;
  const at = (k) => u*u*u*p[0][k] + 3*u*u*t*p[1][k] + 3*u*t*t*p[2][k] + t*t*t*p[3][k];
  return { x: at('x'), y: at('y') };
};
const archD = (p) =>
  `M${p[0].x} ${p[0].y} C${p[1].x} ${p[1].y}, ${p[2].x} ${p[2].y}, ${p[3].x} ${p[3].y}`;

/* `t` is where along its own curve this edge's label sits; see the caller.
   `w` is the canvas width, which only the last case needs. */
function archRoute(a, b, kind, t, alt, w){
  const A = archBox(a), B = archBox(b), P = (x,y) => ({x, y});
  const cubic = (p) => { const at = archAt(p, t); return { d: archD(p), lx: at.x, ly: at.y - 4 }; };

  // The order path, arcing over everything. It is the only edge here that
  // moves money and it should not read as one more data line.
  //
  // The control points are solved for the apex rather than guessed: a cubic
  // does not pass through its own controls, so a control at y=25 put the
  // actual arc at y≈57, straight through the lane headings.
  if(kind === 'order' && b.lane < a.lane){
    const c = (4/3) * ((16 + (b.row % 3) * 10) - (A.y + B.y)/8);
    return cubic([P(A.cx, A.y), P(A.cx, c), P(B.cx, c), P(B.cx, B.y)]);
  }

  // Two lanes or more apart. A curve drawn straight across would cross the
  // faces of every card in between, so this goes UP the gutter beside the
  // source, across ABOVE the cards, and down the gutter beside the target —
  // through the only space on the canvas guaranteed to be empty.
  if(b.lane - a.lane >= 2){
    const g1 = A.x + A.w + A_GUT, g2 = B.x - A_GUT, r = 16;
    return {
      d: `M${A.x + A.w} ${A.cy} L${g1 - r} ${A.cy} Q${g1} ${A.cy} ${g1} ${A.cy - r}` +
         ` L${g1} ${alt + r} Q${g1} ${alt} ${g1 + r} ${alt}` +
         ` L${g2 - r} ${alt} Q${g2} ${alt} ${g2} ${alt + r}` +
         ` L${g2} ${B.cy - r} Q${g2} ${B.cy} ${g2 + r} ${B.cy} L${B.x} ${B.cy}`,
      lx: (g1 + g2) / 2, ly: alt - 5,
    };
  }
  if(a.lane < b.lane){
    const x1 = A.x + A.w, x2 = B.x, dx = Math.max(30, (x2 - x1) * 0.55);
    return cubic([P(x1, A.cy), P(x1+dx, A.cy), P(x2-dx, B.cy), P(x2, B.cy)]);
  }
  // One lane back: an S that stays INSIDE the gutter. The earlier version
  // dipped below its own endpoints and swept across three cards to do it.
  if(a.lane > b.lane){
    const x1 = A.x, x2 = B.x + B.w;
    return cubic([P(x1, A.cy), P(x1-A_GUT, A.cy), P(x2+A_GUT, B.cy), P(x2, B.cy)]);
  }
  // Same lane: bulge out into a gutter. Down goes right and up goes left, so
  // a write and the read that answers it read as the two sides of a loop —
  // except in the last lane, where bulging right runs off the canvas and the
  // archive edge was drawn half outside the picture.
  const down = b.row > a.row;
  let off = (down ? 1 : -1) * (A.w/2 + 34);
  if(A.cx + off > w - 12 || A.cx + off < 12) off = -off;
  const y1 = down ? A.y + A.h : A.y, y2 = down ? B.y : B.y + B.h;
  return cubic([P(A.cx, y1), P(A.cx+off, y1), P(B.cx+off, y2), P(B.cx, y2)]);
}

/* One line of evidence per node — and it is EVIDENCE, never a restatement of
   the state chip. "up 41m · pid 2466552" and "14s ago · 15 KB" are both facts
   a reader can go and check; "healthy" is not. */
function archChip(n, now){
  if(n.kind === 'timer')
    return n.state === 'live' ? 'next in ' + dur(n.next_s - now) : 'not scheduled';
  // The pid gives way to the tag when there is one: ARMED is the more
  // important fact, and side by side the two ran into each other.
  if(n.up_s != null)
    return 'up ' + dur(n.up_s) +
      (n.pid && !(n.tags||[]).length ? ' · pid ' + n.pid : '');
  if(n.age_s == null) return n.state === 'off' ? 'not writing' : 'missing';
  return dur(n.age_s) + ' ago' + (n.bytes != null ? ' · ' + archBytes(n.bytes) : '');
}

function archNode(n, now){
  const B = archBox(n);
  const tag = (n.tags && n.tags.length) ? n.tags[0] : '';
  const dot = 'd-' + n.state + (n.state === 'live' ? ' pulse' : '');
  return `<g class="an k-${n.kind} st-${n.state}" data-k="n-${esc(n.id)}">
    <title>${esc(n.label)} — ${esc(n.what)}</title>
    <rect class="nbox" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="7"/>
    <rect class="nbar b-${n.state}" x="${B.x}" y="${B.y}" width="3" height="${B.h}"/>
    <circle class="ndot ${dot}" cx="${B.x+B.w-11}" cy="${B.y+15}" r="3.5"/>
    <text class="nlabel" x="${B.x+12}" y="${B.y+19}">${esc(archTrunc(n.label,21))}</text>
    <text class="nsub" x="${B.x+12}" y="${B.y+34}">${esc(archTrunc(n.sub,28))}</text>
    <text class="nchip c-${n.state}" x="${B.x+12}" y="${B.y+51}">${esc(archChip(n,now))}</text>
    ${tag ? `<text class="ntag" x="${B.x+B.w-11}" y="${B.y+51}"
      text-anchor="end">${esc(tag)}</text>` : ''}
  </g>`;
}

function archSvg(d){
  const N = {};
  d.nodes.forEach(n => { N[n.id] = n; });
  const rows  = Math.max(...d.nodes.map(n => n.row)) + 1;
  const lanes = d.lanes.length;
  const W = A_PAD*2 + lanes*A_LANEW + (lanes-1)*A_GAP;
  const H = archY(rows-1) + A_BOXH + 26;
  const now = d.generated_at;

  const marker = (kind) =>
    `<marker id="ah-${kind}" markerWidth="7" markerHeight="7" refX="6.5" refY="3"
       orient="auto" markerUnits="userSpaceOnUse">
       <path class="m-${kind}" d="M0,0 L7,3 L0,6 z"/></marker>`;

  const bands = d.lanes.map((l,i) => `
    <rect class="laneband" x="${archX(i)-10}" y="${A_TOP-34}"
      width="${A_LANEW+20}" height="${rows*A_ROWH+8}" rx="10"/>
    <text class="lane" x="${archX(i)}" y="${A_TOP-42}">${esc(l)}</text>`).join('');

  /* Labels are spread along their own curves exactly where they would
     otherwise converge: five edges arrive at the dashboard and three leave
     the socket, and every one of those labels wants the same few pixels.
     Spread by the TARGET where edges fan in, by the source where they fan
     out, and leave a lone edge at its midpoint. Deterministic, so the picture
     does not reshuffle on every repaint. */
  const into = {}, from = {}, seenTo = {}, seenFrom = {}, alt = {};
  d.edges.forEach(e => {
    into[e.to]   = (into[e.to]   || 0) + 1;
    from[e.from] = (from[e.from] || 0) + 1;
  });
  const edges = d.edges.map(e => {
    const a = N[e.from], b = N[e.to];
    if(!a || !b) return '';
    const ti = seenTo[e.to]     = (seenTo[e.to]     || 0), fi = seenFrom[e.from] = (seenFrom[e.from] || 0);
    seenTo[e.to] = ti + 1; seenFrom[e.from] = fi + 1;
    const t = into[e.to] > 1      ? 0.22 + ti * (0.56 / (into[e.to] - 1))
            : from[e.from] > 1    ? 0.30 + fi * (0.48 / (from[e.from] - 1))
            : 0.5;
    // Long-haul edges each get their own altitude so two of them never share
    // a line. Only they consume one — the counter is what spaces them.
    const key = e.from + '>' + e.to;
    if(b.lane - a.lane >= 2 && alt[key] === undefined)
      alt[key] = 52 + Object.keys(alt).length * 14;
    const cls  = e.live ? e.kind : 'dead';
    const flow = e.live && (e.kind === 'feed' || e.kind === 'order') ? ' flow' : '';
    const r = archRoute(a, b, e.kind, t, alt[key], W);
    return `<g data-k="e-${esc(e.from)}-${esc(e.to)}">
      <path class="e ${cls}${flow}" d="${r.d}" marker-end="url(#ah-${cls})"/>
      <text class="elabel" x="${r.lx.toFixed(1)}" y="${r.ly.toFixed(1)}"
        text-anchor="middle">${esc(e.label)}</text>
    </g>`;
  }).join('');

  return `<svg class="arch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="arbbot component architecture">
    <defs>${['feed','write','read','order','dead'].map(marker).join('')}</defs>
    ${bands}${edges}
    ${d.nodes.map(n => archNode(n, now)).join('')}
  </svg>`;
}

}

  {path:'/trades',        label:'Trades'},
  {path:'/live',          label:'Live'},
  {path:'/architecture',  label:'Architecture'},
];

const json = (u) => fetch(u).then(r=>r.json());

/* ===========================================================================
   STATE

   One mutable object, one renderer, and a rule with no exceptions:

     the document is a pure function of S, and NOTHING outside render() may
     touch it.

   Everything asynchronous — a fetch reply, a pushed frame, a click — writes to
   S through set() and stops there. That is not ceremony; it is the fix for a
   bug that appeared twice in this file. Both times an async callback wrote
   into a node that a later repaint had already discarded: first the drill-down
   chart, then the drill-down chart again after the repaint became a patch. You
   cannot write into a stale node if you never write into a node.

   set() coalesces to one render per animation frame, so a burst of updates
   costs one repaint, and render() morphs rather than replaces (see morph
   above), so a repaint costs only what actually changed.
   =========================================================================== */
const S = {
  data:      {},                 // endpoint key -> payload, or {error}
  stream:    {},                 // last SSE frame
  pairQuery: '',
  trades:    {query:'', status:'all', strategy:'all', sort:'time:desc', page:1, pageSize:25},
  link:      {cls:'dim', text:'● connecting…', title:''},
};

let scheduled = false;
function set(mutate){
  mutate(S);
  if(scheduled) return;
  scheduled = true;
  requestAnimationFrame(() => { scheduled = false; render(); });
}

/* --------------------------------------------------------------------------
   ROUTES — what each page needs, which stream key invalidates it, how it draws
   -------------------------------------------------------------------------- */
function page(){
  const p = location.pathname;
  return NEEDS[p] ? p : '/';
}

const NEEDS = {
  '/':              () => ({books:    '/api/books'}),
  '/recording':     () => ({integrity:'/api/integrity'}),
  '/opportunities': () => ({opps:     '/api/opportunities' + location.search}),
  '/pairs':         () => ({pairs:    '/api/pairs'}),
  '/now':           () => ({now:      '/api/now'}),
  '/trades':        () => ({trades:   '/api/trades'}),
  '/live':          () => ({}),
  '/architecture':  () => ({arch:     '/api/architecture'}),
};

/* A frame that does not move THIS page's key is not a reason to refetch it —
   which is what makes a push cheaper than a poll. */
const TOPIC = {
  '/':'books', '/recording':'recording', '/opportunities':'opportunities',
  '/pairs':'pairs', '/trades':'now', '/live':'now',
  // The tape moving is the cheapest proof the ingest half is alive, so it is
  // also the right thing to re-measure the whole picture on.
  '/architecture':'recording',
  // Its own key: this view is about the armed engine's append-only feed.
  '/now':'now',
};

const qtyf = (v) => (v===null||v===undefined||!isFinite(Number(v))) ? '—'
  : Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
const cents = (v) => (v===null||v===undefined||!isFinite(Number(v))) ? '—'
  : (Number(v)*100).toFixed(1)+'¢';
function capitalAge(b=S.data.books, now=Date.now()/1000){
  const at=Number(b?.at);
  return b?.at!=null&&Number.isFinite(at)&&at<=now ? now-at : null;
}
function capitalFresh(b=S.data.books, now=Date.now()/1000){
  const at=Number(b?.at), max=Number(b?.max_age_s);
  return b?.producer_alive===true&&b?.at!=null&&b?.max_age_s!=null
    &&Number.isFinite(at)&&Number.isFinite(max)
    &&at<=now&&max>0&&now-at<=max;
}
function executableLegFresh(leg, b=S.data.books, now=Date.now()/1000){
  const at=Number(leg?.executable_mark_at);
  return leg?.executable_mark_at!=null&&capitalFresh(b,now)&&Number.isFinite(at)
    &&at<=now&&now-at<=180;
}
function venueSummary(name, a, color, subtitle){
  return `<div class="venue-summary" style="--venue:${color}">

    <div class="venue-metrics">
      <div><span>Available</span><b>${usd(a?.available_cash_usd)}</b></div>
      <div><span>Positions</span><b>${usd(a?.positions_value_usd)}</b></div>
      <div><span>Equity</span><b>${usd(a?.equity_usd)}</b></div>
    </div></div>`;
}
function positionLeg(leg, cls){
  if(!leg?.present) return `<div class="leg-card ${cls}"><span class="bad">No position</span>
    <div class="market-id" title="${esc(leg?.market||'')}">${esc(leg?.market||'unknown market')}</div></div>`;
  const q=Number(leg.quantity), side=leg.held_side||'', sideClass=side==='YES'?'yes':'no';
  const markFresh=executableLegFresh(leg);
  const markTime=Number(leg.executable_mark_at);
  const markLabel=markFresh&&Number.isFinite(markTime)
    ? `Executable book mark · ${new Date(markTime*1000).toLocaleString()}`
    : 'No fresh executable mark';
  return `<div class="leg-card ${cls}" title="${esc(markLabel)}">
    <div class="leg-top"><div class="position-chip">${qtyf(Math.abs(q))} <span class="${sideClass}">${esc(side)}</span></div>
      <span class="mini-label">${cents(markFresh?leg.yes_mark:null)} YES</span></div>
    <div class="leg-value">${cents(markFresh?leg.held_mark:null)} <span class="sub">${markFresh?'held-side mark':'no fresh mark'}</span></div>
    <div class="market-id" title="${esc(leg.market)}">${esc(leg.market)}</div>
    <div class="sub" style="margin-top:4px">position value ${usd(leg.value_usd)}</div>
  </div>`;
}
function positionComparison(pc){
  const pairs=pc?.pairs||[], orphans=pc?.orphans||[];
  const complete=pairs.filter(p=>p.kalshi?.present&&p.polymarket_us?.present);
  const balanced=complete.filter(p=>p.balanced).length;
  const priced=complete.filter(p=>executableLegFresh(p.kalshi)&&executableLegFresh(p.polymarket_us)
    &&p.liquidation_value_per_contract!==null&&p.liquidation_value_per_contract!==undefined);
  const carry=priced.reduce((s,p)=>s+Number(p.distance_to_par_usd),0);
  const rows=pairs.map(p=>{
    const hasBoth=p.kalshi?.present&&p.polymarket_us?.present;
    const known=executableLegFresh(p.kalshi)&&executableLegFresh(p.polymarket_us)
      &&p.liquidation_value_per_contract!==null&&p.liquidation_value_per_contract!==undefined;
    const dist=Number(p.distance_to_par_cents);
    const crossed=known&&dist<0;
    const basisMismatch=p.entry_basis_qty!==null&&p.entry_basis_qty!==undefined&&p.paired_qty!==null&&p.paired_qty!==undefined
      && Math.abs(Number(p.entry_basis_qty)-Number(p.paired_qty))>.005;
    const status=!hasBoth?'unpaired':(p.balanced?'balanced':(!p.opposed?'directional':'size mismatch'));
    const statusClass=p.balanced?'':(!hasBoth||!p.opposed?'bad':'warn');
    const juice=known ? (crossed?`${Math.abs(dist).toFixed(1)}¢ crossed`:`${dist.toFixed(1)}¢`) : '—';
    const juiceClass=crossed?'ok':(!known?'warn':'');
    return `<div class="pair-wrap" data-k="${esc(p.relationship_id)}">
      <div class="pair-title"><i class="status-dot ${statusClass}"></i><strong>${esc(p.label)}</strong>
        <span class="badge ${statusClass}">${esc(status)}</span><span class="pair-id">${esc(p.relationship_id)}</span></div>
      <div class="pair-row">
        ${positionLeg(p.kalshi,'kalshi')}
        <div class="pair-core">
          <div class="juice ${juiceClass}">${juice}</div>
          <div class="juice-label">${!known?'no fresh paired quote':(crossed?'top-of-book value over par':'carry / juice left to par')}</div>
          <div class="pair-facts"><span><b>${qtyf(p.paired_qty)}</b> paired</span><span><b class="${Number(p.qty_gap)>.005?'warn':''}">${qtyf(p.qty_gap)}</b> gap</span></div>
          ${known?`<div class="sub" style="margin-top:6px">liquidation value <b>${cents(p.liquidation_value_per_contract)} / ct</b> · ${usd(p.distance_to_par_usd)} to $1 payout</div>`:''}
          ${p.entry_price_per_contract!==null&&p.entry_price_per_contract!==undefined
            ? `<div class="sub">entry price <b>${cents(p.entry_price_per_contract)} / ct</b> · ${basisMismatch
                ? `<span class="warn" title="The folded ledger and venue positions do not cover the same quantity">ledger ${qtyf(p.entry_basis_qty)} ct vs ${qtyf(p.paired_qty)} paired</span>`
                : `${qtyf(p.entry_basis_qty)} ct ledger basis`}</div>`
            : '<div class="sub">entry price <span class="warn">unavailable</span></div>'}
        </div>
        ${positionLeg(p.polymarket_us,'pmus')}
      </div></div>`;
  }).join('');
  const orphanRows=orphans.map(h=>`<tr><td>${esc(h.venue)}</td><td>${esc(h.market)}</td><td class="num">${qtyf(h.quantity)}</td><td class="num">${usd(h.value_usd)}</td></tr>`).join('');
  return $(`<section class="wide pair-board">
    <div class="pair-board-head"><div><h2>Cross-venue position map</h2><div class="sub">Equivalent outcomes aligned side by side · largest dollar distance to par first</div></div>
      <div class="pair-summary"><div><b>${balanced}/${complete.length}</b><span>size-balanced</span></div><div><b>${priced.length?usd(carry):'—'}</b><span>carry · ${priced.length}/${complete.length} fresh</span></div><div><b class="${orphans.length?'warn':''}">${orphans.length}</b><span>unmapped</span></div></div></div>
    <div class="pair-columns"><span style="color:var(--kalshi)">Kalshi position</span><span>Convergence</span><span style="color:var(--pmus)">Polymarket US position</span></div>
    ${rows||'<div class="pair-wrap dim">No registry-linked positions in the latest snapshot.</div>'}
    <div class="design-note" style="padding:0 22px 18px"><b>Liquidation value</b> is a gross top-of-book estimate shown only while both executable book marks and the account snapshot are fresh; fees and available depth can reduce actual proceeds. <b>Entry price</b> is the weighted all-in ledger basis of the contracts still open, including entry fees. A partial unwind prorates the original basis—it does not net realized sale proceeds against the remaining shares. An amber quantity comparison means the ledger basis and venue truth do not cover the same contracts, so treat that entry price as incomplete. <b>Carry / juice left</b> is $1 minus liquidation value and includes both remaining convergence and today’s crossing spreads.</div>
    ${orphanRows?`<div class="pair-wrap orphan-table"><h2>Unmapped venue positions</h2><table><thead><tr><th>venue</th><th>market</th><th class="num">signed contracts</th><th class="num">value</th></tr></thead><tbody>${orphanRows}</tbody></table></div>`:''}
  </section>`);
}

      <p>${kcomplete?`Book values minus venue total: <b>${usd(ksubtotal-Number(accounts.kalshi?.positions_value_usd))}</b>.`:'Full comparison unavailable until every position has a fresh quote.'}</p>
      <p class="sub">YES holdings use the bid; NO holdings use one minus the ask. Differences can reflect spreads, valuation methods, or reads taken at different times. Account equity uses the venue portfolio total.</p></section>`));
    return `${fresh?'Auto-updating':'Stale snapshot'} &middot; equity ${usd(t.equity_usd)} &middot; available ${usd(t.available_cash_usd)}`;
  },
  '/recording': (f) => {

           ` &middot; ${pctf(t.blended_apr_pct)}/yr to hold` +
           ` &middot; realized <b class="${sign(t.realized_net_usd)}">$${money(t.realized_net_usd||0)}</b>` +
           ` at ${pctf(t.realized_apr_pct)}/yr` +

    f.append(archTable(d));

function loading(f, what){
  f.append($(`<section class="wide"><div class="dim">loading ${esc(what)}…</div></section>`));
  return `loading ${esc(what)}…`;
}
function fail(f, msg){
  f.append($(`<section class="wide err">${esc(msg)}</section>`));
  return `<span class="bad">${esc(msg)}</span>`;
}
/* --------------------------------------------------------------------------
   TRADES — what this system actually did, and what it was worth.

   Every number is derived server-side from the append-only ledger. Nothing is
   stored twice, so this view cannot drift from what the engine booked.
   -------------------------------------------------------------------------- */
const pctf = (v) => (v===null||v===undefined||!isFinite(v)) ? '&mdash;'
  : (Number(v)>=0?'':'') + Number(v).toFixed(1) + '%';

/* How long the capital was out, in the largest unit that still reads as a
   duration. This is NOT decoration: it is the denominator of the realized APR
   beside it, and a three-figure APR means one thing over five weeks and quite
   another over nine minutes. Never render one without the other. */
/* Dollar-years span four orders of magnitude on this book — 1.8 for the
   unwinds, 0.0002 for a probe. A fixed 3dp renders the small end as "0.000",
   which reads as a divide-by-nothing beside a five-figure rate when it is
   really a very small but perfectly real denominator. */
const dyears = (v) => (v===null||v===undefined||!isFinite(v)) ? '&mdash;'
  : Number(v) >= 0.01 ? Number(v).toFixed(3) : Number(v).toPrecision(2);

const held = (d) => {
  if (d===null || d===undefined || !isFinite(d)) return '&mdash;';
  if (d >= 1) return Number(d).toFixed(1) + 'd';
  const h = d * 24;
  if (h >= 1) return h.toFixed(1) + 'h';
  const m = h * 60;
  if (m >= 1) return m.toFixed(0) + 'm';
  /* Sub-minute must LOOK sub-minute. Four probe pairs on disk are a
     millisecond apart; rounding those up to "1m" would hide the very thing
     that makes their annualized rate meaningless. */
  const sec = m * 60;
  return sec >= 1 ? sec.toFixed(0) + 's' : (sec * 1000).toFixed(0) + 'ms';
};

function tradeTotals(d){
  const t = d.totals || {};
  const review = Number(t.unpriced_rows||0);
  return $(`<section class="wide trades-hero"><div class="hero-line"><div>
    <div class="eyebrow">Ledger performance</div>
    <div class="hero-value ${usdSign(t.realized_net_usd)}">${usd(t.realized_net_usd||0)}</div>
    <div class="trade-headline"><span>realized net</span>
      <span class="badge ${review?'warn':'ok'}">${review ? review+' need review' : 'fully priced'}</span></div>
    <div class="sub" style="margin-top:7px">${Number(t.realized_trades||0).toLocaleString()} realized records · ${Number(t.round_trips||0).toLocaleString()} matched round trips</div>
    </div><div class="metric-grid">
      <div class="metric-card"><span>Locked while open</span><b class="${usdSign(t.open_net_usd)}">${usd(t.open_net_usd||0)}</b><div class="sub">${Number(t.open_trades||0).toLocaleString()} positions · ${Number(t.open_contracts||0).toLocaleString()} contracts</div></div>
      <div class="metric-card"><span>Capital working</span><b>${usd(t.open_cost_usd||0)}</b><div class="sub">at cost, including fees</div></div>
      <div class="metric-card"><span>APR to resolution</span><b class="${usdSign(t.blended_apr_pct)}">${pctf(t.blended_apr_pct)}</b><div class="sub">capital-weighted open book</div></div>
      <div class="metric-card"><span>Realized APR</span><b class="${usdSign(t.realized_apr_pct)}">${pctf(t.realized_apr_pct)}</b><div class="sub">over ${dyears(t.realized_dollar_years||0)} dollar-years</div></div>
      <div class="metric-card"><span>Fees</span><b class="warn">${usd(Number(t.fees_settled_usd||0)+Number(t.fees_modelled_usd||0))}</b><div class="sub">${usd(t.fees_settled_usd||0)} settled · ${usd(t.fees_modelled_usd||0)} modelled</div></div>
      <div class="metric-card"><span>Realized basis</span><b>${usd(t.realized_cost_usd||0)}</b><div class="sub">capital across matched exits</div></div>
    </div></div>
    <details class="audit-note" style="margin-top:18px"><summary>How these figures are defined</summary><div class="sub">
      A <b>hedged</b> basket &mdash; both sides held, each covering the whole
      contract count &mdash; pays exactly <b>$1.00/contract</b> at resolution
      whatever the event does, so profit is payoff minus cost: locked, not
      forecast. <b>Nothing else is.</b> A single-leg or same-side position is a
      directional bet that pays $0.00 or $1.00, so it is shown as
      <b class="warn">unknown</b> and is excluded from Locked and from the APR
      &mdash; its contracts and its capital are still counted above, because
      those are facts. Closed rows use the ledger's own realized P&amp;L wherever
      the record carries one; where it does not, the close is priced from its own
      exit fills against the basis of the entry it retired, and is counted in
      <b>Realized, derived not banked</b>. Open and realized are kept apart:
      realized money is back in the account and is not earning this APR.
      <b>APR to hold</b> is capital-weighted and measured from today to
      resolution; <b>Realized APR</b> is what the closed capital actually earned
      over the time it was out, weighted by <b>dollar-years</b> so that one fast
      small turn cannot set the book's rate.
      <br><br>Every figure here comes from the ledger alone. It is <b>not</b>
      reconciled against venue position snapshots, and it is <b>not</b> comparable
      to the Books statement — different populations, and the PM-US side of that
      statement is plug-dominated. Do not read agreement between the two as a
      check on either.
    </div></details>
  </section>`);
}

function venueRolePanel(d){
