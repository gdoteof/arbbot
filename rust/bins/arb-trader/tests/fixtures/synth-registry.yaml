# invented, so nothing here mirrors the private live registry.
#
# It is human-vetted because the engine now hard-gates on that (card c9ac7d1d):
# an unvetted relationship yields NO quoters, and these tests would then assert
# determinism over an empty intent stream. The gate itself is tested in
# arb-trader's gate_tests, not here.
relationships:
  - id: synth-fill-rel
    type: cross-venue-equivalent
    verdict: equivalent
    vetted_by: human
    tranche: core
    legs:
      - venue: kalshi
        market_id: SYNTH-K-YES
      - venue: polymarket_us
        market_id: SYNTH-P-YES
