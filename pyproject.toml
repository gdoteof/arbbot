[project]
name = "arbbot"
version = "0.1.0"
description = "Personal Polymarket/Kalshi prediction-market arbitrage bot (staged autonomous stack)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "websockets>=12.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
